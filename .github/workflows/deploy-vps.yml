name: Deploy to VPS

on:
  workflow_run:
    workflows:
      - Build Docker Image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy. Defaults to latest.
        required: false
        default: latest

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PULL_PROXY_PREFIX: ghcr.nju.edu.cn
  CONTAINER_NAME: rbook
  CONTAINER_PORT: 3000
  HOST_PORT: 3000
  VPS_REPO_DIR: /opt/rbook/rbook_nunjucks
  VPS_REPO_BRANCH: main
  VPS_REPO_URL: https://gh-proxy.com/https://github.com/${{ github.repository }}.git
  DOCKER_NETWORK: rbook-services
  PCS2_CONTAINER_NAME: problems-solution
  PCS2_API_BASE_URL: http://problems-solution:3000
  PCS2_PUBLIC_BASE_URL: https://pcs2.roj.ac.cn

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: bohai
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            TAG='${{ inputs.image_tag }}'
          else
            TAG="$(printf '%s' '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)"
          fi

          echo "image=${{ env.PULL_PROXY_PREFIX }}/$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ssh-keyscan 在端口不可达时既不报错也不输出，只是静默等满超时再退出 1。
          # runner 到 VPS 偶发网络抖动时，一次失败不应该让整个部署失败。
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if ssh-keyscan -T 10 -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan ok (attempt ${attempt}/${max_attempts})"
              break
            fi
            if [ "$attempt" = "$max_attempts" ]; then
              echo "::error::ssh-keyscan $VPS_HOST:$VPS_SSH_PORT failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            backoff=$(( attempt * 5 ))
            echo "ssh-keyscan attempt ${attempt} failed; retry in ${backoff}s" >&2
            sleep "$backoff"
          done

          # 提前确认真的能登录，避免部署走到一半才失败。
          for attempt in 1 2 3; do
            if ssh -p "$VPS_SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then
              echo "ssh connectivity ok (attempt ${attempt}/3)"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::cannot ssh $VPS_USER@$VPS_HOST:$VPS_SSH_PORT" >&2
              exit 1
            fi
            echo "ssh probe attempt ${attempt} failed; retry in 10s" >&2
            sleep 10
          done

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          IMAGE: ${{ steps.meta.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ secrets.RBOOK_HOST_PORT || env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          RBOOK_ADMIN_TOKEN: ${{ secrets.RBOOK_ADMIN_TOKEN }}
          VPS_REPO_DIR: ${{ env.VPS_REPO_DIR }}
          VPS_REPO_BRANCH: ${{ env.VPS_REPO_BRANCH }}
          VPS_REPO_URL: ${{ env.VPS_REPO_URL }}
          DOCKER_NETWORK: ${{ env.DOCKER_NETWORK }}
          PCS2_CONTAINER_NAME: ${{ env.PCS2_CONTAINER_NAME }}
          PCS2_API_BASE_URL: ${{ env.PCS2_API_BASE_URL }}
          PCS2_PUBLIC_BASE_URL: ${{ env.PCS2_PUBLIC_BASE_URL }}
        run: |
          REMOTE_SCRIPT="/tmp/rbook-deploy-vps-${GITHUB_SHA}.sh"
          scp \
            -P "$VPS_SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            scripts/deploy-vps.sh \
            "$VPS_USER@$VPS_HOST:$REMOTE_SCRIPT"

          ssh \
            -p "$VPS_SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_MODE='image' IMAGE='$IMAGE' CONTAINER_NAME='$CONTAINER_NAME' HOST_PORT='$HOST_PORT' CONTAINER_PORT='$CONTAINER_PORT' RBOOK_ADMIN_TOKEN='$RBOOK_ADMIN_TOKEN' VPS_REPO_DIR='$VPS_REPO_DIR' VPS_REPO_BRANCH='$VPS_REPO_BRANCH' VPS_REPO_URL='$VPS_REPO_URL' DOCKER_NETWORK='$DOCKER_NETWORK' PCS2_CONTAINER_NAME='$PCS2_CONTAINER_NAME' PCS2_API_BASE_URL='$PCS2_API_BASE_URL' PCS2_PUBLIC_BASE_URL='$PCS2_PUBLIC_BASE_URL' bash '$REMOTE_SCRIPT'"
