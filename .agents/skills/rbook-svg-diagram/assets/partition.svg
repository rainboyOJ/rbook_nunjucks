<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="partition-title partition-desc">
  <title id="partition-title">分块或切边关系模板</title>
  <desc id="partition-desc">左右两个分区分别包含若干节点，中间重点节点通过方向箭头连接。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .region { stroke-width: 2; stroke-dasharray: 7 6; }
    .region--left { fill: #fff7ed; stroke: #d97706; }
    .region--right { fill: #ecfdf5; stroke: #059669; }
    .edge { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
    .edge--focus { fill: none; stroke: #2563eb; stroke-width: 3; }
    .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .node--left { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .node--right { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .label { fill: #1f2937; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--left { fill: #b45309; }
    .label--right { fill: #047857; }
  </style>
  <defs>
    <marker id="partition-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect class="canvas" width="640" height="300" />
  <g id="regions">
    <rect class="region region--left" x="24" y="36" width="250" height="228" rx="8" />
    <rect class="region region--right" x="366" y="36" width="250" height="228" rx="8" />
    <text class="label label--left" x="149" y="68">左侧</text>
    <text class="label label--right" x="491" y="68">右侧</text>
  </g>
  <g id="partition-graph">
    <line class="edge" x1="86" y1="132" x2="150" y2="164" />
    <line class="edge" x1="86" y1="212" x2="150" y2="164" />
    <line class="edge" x1="150" y1="164" x2="224" y2="164" />
    <line class="edge--focus" x1="250" y1="164" x2="390" y2="164" marker-end="url(#partition-arrow)" />
    <line class="edge" x1="416" y1="164" x2="486" y2="164" />
    <line class="edge" x1="486" y1="164" x2="550" y2="120" />
    <line class="edge" x1="486" y1="164" x2="550" y2="208" />
    <circle class="node" cx="86" cy="132" r="22" />
    <circle class="node" cx="86" cy="212" r="22" />
    <circle class="node" cx="150" cy="164" r="22" />
    <circle class="node--left" cx="224" cy="164" r="26" />
    <circle class="node--right" cx="390" cy="164" r="26" />
    <circle class="node" cx="486" cy="164" r="22" />
    <circle class="node" cx="550" cy="120" r="22" />
    <circle class="node" cx="550" cy="208" r="22" />
    <text class="label" x="224" y="164">u</text>
    <text class="label" x="390" y="164">v</text>
  </g>
</svg>
