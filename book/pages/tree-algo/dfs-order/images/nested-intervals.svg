<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="nested-intervals-title nested-intervals-desc">
  <title id="nested-intervals-title">每个点的子树是时间轴上一段区间</title>
  <desc id="nested-intervals-desc">七个点各画一条从 in 到 out 的杆，点 2 的杆蓝色、点 3 的杆橙色、点 7 的杆绿色。蓝杆把点 4、5、7 的区间整个包住，橙杆与蓝杆不重叠。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
    .bar { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
    .bar--ancestor { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .bar--inside { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .bar--sibling { fill: #fff7ed; stroke: #d97706; stroke-width: 3; }
    .label { fill: #1f2937; font: 600 15px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--secondary { fill: #64748b; font: 400 14px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--end { text-anchor: end; }
    .label--start { text-anchor: start; }
    .label--ancestor { fill: #2563eb; font: 600 14px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: start; dominant-baseline: central; }
  </style>
  <rect class="canvas" width="720" height="430" />

  <text class="label--secondary label--start" x="28" y="30">每条杆是 [in(u), out(u)]，长度就是子树大小</text>

  <g id="grid-lines">
    <line class="grid" x1="120" y1="56" x2="120" y2="372" />
    <line class="grid" x1="196" y1="56" x2="196" y2="372" />
    <line class="grid" x1="272" y1="56" x2="272" y2="372" />
    <line class="grid" x1="348" y1="56" x2="348" y2="372" />
    <line class="grid" x1="424" y1="56" x2="424" y2="372" />
    <line class="grid" x1="500" y1="56" x2="500" y2="372" />
    <line class="grid" x1="576" y1="56" x2="576" y2="372" />
  </g>

  <g id="bars">
    <text class="label label--end" x="96" y="90">点 1</text>
    <rect class="bar" x="120" y="82" width="456" height="16" rx="8" />

    <text class="label label--end" x="96" y="130">点 2</text>
    <rect class="bar--ancestor" x="196" y="122" width="228" height="16" rx="8" />

    <text class="label label--end" x="96" y="170">点 3</text>
    <rect class="bar--sibling" x="500" y="162" width="76" height="16" rx="8" />

    <text class="label label--end" x="96" y="210">点 4</text>
    <rect class="bar" x="263" y="202" width="18" height="16" rx="8" />

    <text class="label label--end" x="96" y="250">点 5</text>
    <rect class="bar" x="348" y="242" width="76" height="16" rx="8" />

    <text class="label label--end" x="96" y="290">点 6</text>
    <rect class="bar" x="567" y="282" width="18" height="16" rx="8" />

    <text class="label label--end" x="96" y="330">点 7</text>
    <rect class="bar--inside" x="415" y="322" width="18" height="16" rx="8" />
  </g>

  <g id="annotation">
    <text class="label--ancestor" x="440" y="130">2 ⊇ 7，2 是祖先</text>
    <text class="label--secondary label--start" x="592" y="170">2 ∩ 3 = ∅</text>
  </g>

  <g id="axis">
    <line class="axis" x1="120" y1="372" x2="596" y2="372" />
    <text class="label--secondary" x="120" y="396">1</text>
    <text class="label--secondary" x="196" y="396">2</text>
    <text class="label--secondary" x="272" y="396">3</text>
    <text class="label--secondary" x="348" y="396">4</text>
    <text class="label--secondary" x="424" y="396">5</text>
    <text class="label--secondary" x="500" y="396">6</text>
    <text class="label--secondary" x="576" y="396">7</text>
    <text class="label--secondary label--start" x="616" y="396">时间戳</text>
  </g>
</svg>
