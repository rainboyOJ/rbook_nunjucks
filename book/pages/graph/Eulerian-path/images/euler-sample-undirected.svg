<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="380"
  viewBox="0 0 640 380"
  role="img"
  aria-labelledby="sample-undirected-title sample-undirected-desc"
>
  <title id="sample-undirected-title">无向图测试用例的欧拉路走法</title>
  <desc id="sample-undirected-desc">测试用例的五顶点六边图，按编号 1 到 6 的箭头从起点 2 走到终点 3：2-1-5-3 为主路径，3-4-2-3 为先走完的小环。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .edge--main { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }
    .edge--loop { fill: none; stroke: #d97706; stroke-width: 3; stroke-linecap: round; }
    .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .node--start { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .node--target { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .badge { fill: #ffffff; stroke-width: 2; }
    .badge--main { stroke: #2563eb; }
    .badge--loop { stroke: #d97706; }
    .label { fill: #1f2937; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--secondary { fill: #64748b; font: 400 14px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--main { fill: #2563eb; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--loop { fill: #d97706; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .label--target { fill: #059669; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .num { font: 600 14px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .num--main { fill: #2563eb; }
    .num--loop { fill: #d97706; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-loop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#d97706" />
    </marker>
  </defs>
  <rect class="canvas" width="640" height="380" />
  <g id="graph">
    <g id="walk-edges">
      <line class="edge--main" x1="278" y1="85" x2="148" y2="106" marker-end="url(#arrow-main)" />
      <line class="edge--main" x1="114" y1="137" x2="101" y2="222" marker-end="url(#arrow-main)" />
      <line class="edge--main" x1="118" y1="249" x2="368" y2="233" marker-end="url(#arrow-main)" />
      <line class="edge--loop" x1="370" y1="243" x2="256" y2="289" marker-end="url(#arrow-loop)" />
      <line class="edge--loop" x1="241" y1="273" x2="297" y2="111" marker-end="url(#arrow-loop)" />
      <line class="edge--loop" x1="327" y1="108" x2="381" y2="204" marker-end="url(#arrow-loop)" />
    </g>
    <g id="walk-steps">
      <circle class="badge badge--main" cx="212" cy="96" r="13" />
      <text class="num num--main" x="212" y="96">1</text>
      <circle class="badge badge--main" cx="105" cy="180" r="13" />
      <text class="num num--main" x="105" y="180">2</text>
      <circle class="badge badge--main" cx="243" cy="241" r="13" />
      <text class="num num--main" x="243" y="241">3</text>
      <circle class="badge badge--loop" cx="313" cy="265" r="13" />
      <text class="num num--loop" x="313" y="265">4</text>
      <circle class="badge badge--loop" cx="270" cy="192" r="13" />
      <text class="num num--loop" x="270" y="192">5</text>
      <circle class="badge badge--loop" cx="355" cy="155" r="13" />
      <text class="num num--loop" x="355" y="155">6</text>
    </g>
    <g id="graph-nodes">
      <circle class="node" cx="120" cy="110" r="22" />
      <circle class="node--start" cx="310" cy="80" r="26" />
      <circle class="node--target" cx="400" cy="230" r="26" />
      <circle class="node" cx="230" cy="300" r="22" />
      <circle class="node" cx="90" cy="250" r="22" />
      <text class="label" x="120" y="110">1</text>
      <text class="label" x="310" y="80">2</text>
      <text class="label" x="400" y="230">3</text>
      <text class="label" x="230" y="300">4</text>
      <text class="label" x="90" y="250">5</text>
    </g>
    <g id="graph-notes">
      <text class="label--main" x="310" y="42">起点</text>
      <text class="label--target" x="430" y="272">终点</text>
      <text class="label--main" x="212" y="62">主路径</text>
      <text class="label--loop" x="330" y="215">小环先走完</text>
    </g>
  </g>
</svg>
