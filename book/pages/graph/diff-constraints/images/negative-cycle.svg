<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="contradiction-title contradiction-desc">
  <title id="contradiction-title">两条约束合成负环</title>
  <desc id="contradiction-desc">x1 到 x2 有一条权 1 的边，x2 到 x1 有一条权 -3 的边。两条边绕成一个权和为 -2 的环，因此约束矛盾。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .edge { fill: none; stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
    .ring { fill: none; stroke: #fecaca; stroke-width: 10; stroke-linecap: round; }
    .node { fill: #ffffff; stroke: #dc2626; stroke-width: 3; }
    .label { fill: #1f2937; font: 600 18px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .weight { fill: #dc2626; font: 600 17px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #ffffff; stroke-width: 6; }
    .sum { fill: #dc2626; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <marker id="contra-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#dc2626" />
    </marker>
  </defs>
  <rect class="canvas" width="640" height="320" />
  <g id="contradiction-edges">
    <path class="edge" d="M 168 108 Q 320 46 472 108" marker-end="url(#contra-arrow)" />
    <path class="edge" d="M 472 172 Q 320 234 168 172" marker-end="url(#contra-arrow)" />
  </g>
  <g id="contradiction-nodes">
    <circle class="node" cx="140" cy="140" r="28" />
    <circle class="node" cx="500" cy="140" r="28" />
    <text class="label" x="140" y="140">x₁</text>
    <text class="label" x="500" y="140">x₂</text>
  </g>
  <g id="contradiction-weights">
    <text class="weight" x="320" y="60">1</text>
    <text class="weight" x="320" y="222">−3</text>
  </g>
  <g id="contradiction-sum">
    <text class="sum" x="320" y="292">环权和 1 + (−3) = −2 &lt; 0</text>
  </g>
</svg>
