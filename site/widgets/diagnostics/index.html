<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 开发诊断</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--danger:#ff8e8e;--warn:#f4c56b;--ok:#8de0a6}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}.shell{margin:auto;max-width:1180px;padding:2rem 1.25rem 4rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2.2rem;margin:0}.lead{color:var(--muted);margin:.35rem 0 1.2rem}.toolbar{display:flex;flex-wrap:wrap;gap:.6rem}.button{background:transparent;border:1px solid var(--accent);color:var(--accent-strong);cursor:pointer;padding:.45rem .7rem}.button:hover,.button:focus-visible{background:var(--accent);color:#17120a;outline:2px solid var(--accent);outline-offset:1px}.status{color:var(--muted);min-height:2rem;padding:.65rem 0}.status.error{color:var(--danger)}.stats{display:grid;gap:.7rem;grid-template-columns:repeat(4,minmax(0,1fr));margin:.7rem 0 1rem}.stat{background:var(--panel);border:1px solid var(--border);padding:.8rem}.stat strong{color:var(--accent-strong);display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.8rem}.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.8rem}.filters input,.filters select{background:var(--raised);border:1px solid var(--border);color:var(--text);min-height:2.4rem;padding:.4rem .6rem}.filters input{flex:1 1 16rem}.filters input:focus,.filters select:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}.issue-list{display:grid;gap:.65rem;list-style:none;margin:0;padding:0}.issue{background:var(--panel);border-left:4px solid var(--warn);padding:.75rem 1rem}.issue.error{border-color:var(--danger)}.issue-head{align-items:center;display:flex;flex-wrap:wrap;gap:.55rem}.level{font-size:.74rem;font-weight:700}.level.error{color:var(--danger)}.level.warning{color:var(--warn)}.stage,.path{color:var(--muted);font-size:.8rem}.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.message{margin:.35rem 0 0;white-space:pre-wrap;word-break:break-word}.link{color:var(--link);font-size:.82rem;text-decoration:none}.link:hover{text-decoration:underline}.empty{border:1px dashed var(--border);color:var(--muted);padding:2rem;text-align:center}.success{border-left:4px solid var(--ok);color:var(--ok);padding:.8rem 1rem}@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.shell{padding:1.25rem .85rem 3rem}.filters input,.filters select{width:100%}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags">标签</a><a href="/relations">关系</a><a href="/practice">学习队列</a><a href="/diagnostics" aria-current="page">开发诊断</a></nav>
      <h1>开发诊断</h1>
      <p class="lead">只在开发服务器使用。启动时的 fatal pre-check error 仍会阻止服务启动，这里展示 warning 和运行中的单页校验/渲染问题。</p>
      <div class="toolbar"><button id="refresh" class="button" type="button">刷新诊断</button></div>
      <div id="status" class="status" role="status" aria-live="polite">正在读取诊断信息...</div>
      <section id="stats" class="stats" hidden></section>
      <div id="filters" class="filters" hidden><input id="search" type="search" placeholder="按文件路径或消息搜索" autocomplete="off"><select id="level"><option value="all">全部级别</option><option value="ERROR">错误</option><option value="WARNING">警告</option></select></div>
      <ul id="issues" class="issue-list" aria-live="polite"></ul>
    </main>
    <script>
      (() => {
        const state = { payload: null, catalog: [], codes: [], search: '', level: 'all' }; const status = document.querySelector('#status'); const stats = document.querySelector('#stats'); const filters = document.querySelector('#filters'); const issues = document.querySelector('#issues'); const search = document.querySelector('#search'); const level = document.querySelector('#level');
        function text(parent, tag, value) { const element = document.createElement(tag); element.textContent = value == null ? '' : String(value); parent.append(element); return element; }
        function articleId(filePath) { const value = String(filePath || '').replace(/^book\/pages\//, ''); const item = state.catalog.find((page) => page.path === value); return item?.id || ''; }
        function codeId(filePath) { const value = String(filePath || '').replace(/^book\/code\//, ''); const item = state.codes.find((code) => code.path === value); return item?.id || ''; }
        function render() { if (!state.payload) return; const payload = state.payload; stats.replaceChildren(); stats.hidden = false; [['pages', payload.stats?.pages], ['codes', payload.stats?.codes], ['errors', payload.stats?.errors], ['warnings', payload.stats?.warnings]].forEach(([label, value]) => { const card = text(stats, 'div', ''); card.className = 'stat'; text(card, 'strong', value ?? 0); text(card, 'span', label); }); filters.hidden = false; const needle = state.search.toLocaleLowerCase(); const visible = (payload.issues || []).filter((issue) => (state.level === 'all' || issue.level === state.level) && (!needle || `${issue.filePath} ${issue.message}`.toLocaleLowerCase().includes(needle))); issues.replaceChildren(); if (!visible.length) { const item = text(issues, 'li', payload.issues?.length ? '没有匹配的问题。' : '诊断通过，没有 warning 或 error。'); item.className = payload.issues?.length ? 'empty' : 'success'; return; } visible.forEach((issue) => { const item = text(issues, 'li', ''); item.className = `issue${issue.level === 'ERROR' ? ' error' : ''}`; const head = text(item, 'div', ''); head.className = 'issue-head'; const levelText = text(head, 'span', issue.level); levelText.className = `level ${issue.level === 'ERROR' ? 'error' : 'warning'}`; text(head, 'span', issue.stage || 'runtime').className = 'stage'; text(head, 'span', issue.filePath || 'unknown').className = 'path'; const message = text(item, 'p', issue.message || ''); message.className = 'message'; const pageId = articleId(issue.filePath); const templateId = codeId(issue.filePath); if (pageId || templateId) { const link = text(item, 'a', pageId ? '检查文章' : '查看模板'); link.className = 'link'; link.href = pageId ? `/article_inspector?id=${encodeURIComponent(pageId)}` : `/api/codes?id=${encodeURIComponent(templateId)}`; if (templateId) link.target = '_blank'; } issues.append(item); }); }
        async function load() { status.textContent = '正在读取诊断信息...'; status.className = 'status'; try { const responses = await Promise.all(['/api/diagnostics', '/api/catalog', '/api/codes'].map((url) => fetch(url, { headers: { Accept: 'application/json' } }))); const payloads = await Promise.all(responses.map((response) => response.json().catch(() => ({})))); if (!responses[0].ok) throw new Error(payloads[0].message || `HTTP ${responses[0].status}`); state.payload = payloads[0]; state.catalog = responses[1].ok ? payloads[1].items || [] : []; state.codes = responses[2].ok ? payloads[2].items || [] : []; status.textContent = `最后读取：${state.payload.generatedAt || '未知时间'}`; render(); } catch (error) { state.payload = null; stats.hidden = true; filters.hidden = true; issues.replaceChildren(); status.textContent = `诊断接口不可用：${error instanceof Error ? error.message : String(error)}。请确认当前是 npm run dev。`; status.className = 'status error'; } }
        document.querySelector('#refresh').addEventListener('click', load); search.addEventListener('input', () => { state.search = search.value.trim(); render(); }); level.addEventListener('change', () => { state.level = level.value; render(); }); load();
      })();
    </script>
  </body>
</html>
