<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 学习队列</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--danger:#ff8e8e;--ok:#8de0a6}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}.shell{margin:auto;max-width:980px;padding:2rem 1.25rem 4rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2.2rem;margin:0}.lead{color:var(--muted);margin:.35rem 0 1.2rem}.controls{background:var(--panel);border:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.6rem;padding:.9rem}.controls select{background:var(--raised);border:1px solid var(--border);color:var(--text);min-height:2.5rem;padding:.45rem .6rem}.check{align-items:center;color:var(--muted);display:flex;gap:.4rem;padding:.4rem}.check input{accent-color:var(--accent);height:1rem;width:1rem}.button{background:transparent;border:1px solid var(--accent);color:var(--accent-strong);cursor:pointer;min-height:2.5rem;padding:.45rem .7rem}.button:hover,.button:focus-visible{background:var(--accent);color:#17120a;outline:2px solid var(--accent);outline-offset:1px}.status{color:var(--muted);min-height:2rem;padding:.6rem 0}.status.error{color:var(--danger)}.progress{background:var(--raised);border:1px solid var(--border);height:.5rem;margin:.5rem 0 1rem}.progress span{background:var(--accent);display:block;height:100%;transition:width 150ms ease}.card{background:var(--panel);border:1px solid var(--accent);padding:1.3rem}.card h2{font-size:1.5rem;margin:.1rem 0 .3rem;overflow-wrap:anywhere}.card-id{color:var(--muted);font: .82rem ui-monospace,SFMono-Regular,Menlo,monospace}.description{color:var(--muted);margin:1rem 0;white-space:pre-wrap}.badges{display:flex;flex-wrap:wrap;gap:.4rem}.badge{border:1px solid var(--border);color:var(--accent-strong);font-size:.78rem;padding:.16rem .42rem}.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}.link{color:var(--link);text-decoration:none}.link:hover{text-decoration:underline}.summary{color:var(--muted);display:flex;flex-wrap:wrap;gap:1rem;margin:.8rem 0}.history{border-top:1px solid var(--border);display:grid;gap:.45rem;margin-top:1.2rem;padding-top:.8rem}.history-item{align-items:center;border-bottom:1px solid var(--border);display:flex;gap:.6rem;justify-content:space-between;padding:.45rem 0}.history-item a{color:var(--link);overflow-wrap:anywhere}.state{color:var(--muted);font-size:.8rem}.empty{border:1px dashed var(--border);color:var(--muted);padding:2rem;text-align:center}@media(max-width:560px){.shell{padding:1.25rem .85rem 3rem}.controls>*{width:100%}.check{justify-content:flex-start}.card h2{font-size:1.25rem}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags">标签</a><a href="/relations">关系</a><a href="/practice" aria-current="page">学习队列</a></nav>
      <h1>学习队列</h1>
      <p class="lead">按标签随机复习文章，进度只保存在当前浏览器。这里不是 OJ 题库，不会进行在线判题。</p>
      <section class="controls" aria-label="学习筛选"><select id="tag"><option value="">全部标签</option></select><label class="check"><input id="include-archive" type="checkbox">包含归档文章</label><button id="next" class="button" type="button">下一篇</button><button id="reset" class="button" type="button">清空本地进度</button></section>
      <div id="status" class="status" role="status" aria-live="polite">正在加载文章...</div><div id="progress" class="progress" aria-label="学习进度"><span></span></div><section id="card" class="card" hidden></section><section id="history" class="history" hidden></section><div id="empty" class="empty">加载文章后会在这里生成学习卡片。</div>
    </main>
    <script>
      (() => {
        const STORAGE_KEY = 'rbook.practice.v1'; const params = new URLSearchParams(location.search); const state = { pages: [], current: params.get('id') || '', tag: params.get('tag') || '', includeArchive: params.get('all') === '1', progress: {} };
        const tag = document.querySelector('#tag'); const includeArchive = document.querySelector('#include-archive'); const next = document.querySelector('#next'); const reset = document.querySelector('#reset'); const status = document.querySelector('#status'); const progressBar = document.querySelector('#progress span'); const card = document.querySelector('#card'); const historyPanel = document.querySelector('#history'); const empty = document.querySelector('#empty'); includeArchive.checked = state.includeArchive;
        function text(parent, tagName, value) { const element = document.createElement(tagName); element.textContent = value == null ? '' : String(value); parent.append(element); return element; }
        function isArchive(item) { return (item.tags || []).some((value) => /归档|archive/i.test(value)) || /archive|old/i.test(String(item.path || '')); }
        function candidates() { return state.pages.filter((item) => (!state.tag || (item.tags || []).includes(state.tag)) && (state.includeArchive || !isArchive(item))); }
        function setUrl() { const nextParams = new URLSearchParams(); if (state.current) nextParams.set('id', state.current); if (state.tag) nextParams.set('tag', state.tag); if (state.includeArchive) nextParams.set('all', '1'); history.replaceState(null, '', `${location.pathname}${nextParams.toString() ? `?${nextParams}` : ''}`); }
        function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch { /* private mode can disable localStorage */ } }
        function loadSaved() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); if (saved && typeof saved === 'object') state.progress = saved; } catch { state.progress = {}; } }
        function counts() { const values = Object.values(state.progress); return { mastered: values.filter((value) => value === 'mastered').length, learning: values.filter((value) => value === 'learning').length, total: candidates().length }; }
        function updateStatus() { const count = counts(); const known = Math.min(count.mastered, count.total); status.textContent = `${count.total} 篇可学习 · 已掌握 ${known} · 学习中 ${count.learning}`; progressBar.style.width = `${count.total ? Math.round(known / count.total * 100) : 0}%`; }
        function renderTags() { const values = [...new Set(state.pages.flatMap((item) => item.tags || []))].sort((a, b) => a.localeCompare(b, 'zh-CN')); tag.replaceChildren(new Option('全部标签', '')); values.forEach((value) => tag.append(new Option(value, value))); tag.value = state.tag; }
        function renderCard() { const item = state.pages.find((page) => page.id === state.current); if (!item) { card.hidden = true; empty.hidden = false; return; } empty.hidden = true; card.hidden = false; card.replaceChildren(); text(card, 'div', item.id || '').className = 'card-id'; text(card, 'h2', item.title || item.id || '未命名文章'); const description = text(card, 'p', item.description || '未填写描述'); description.className = 'description'; const badges = text(card, 'div', ''); badges.className = 'badges'; (item.tags || []).forEach((value) => text(badges, 'span', value).className = 'badge'); const actions = text(card, 'div', ''); actions.className = 'actions'; const open = text(actions, 'a', '打开文章'); open.className = 'button link'; open.href = item.url || '#'; const inspect = text(actions, 'a', '检查文章'); inspect.className = 'button link'; inspect.href = `/article_inspector?id=${encodeURIComponent(item.id || '')}`; ['learning', 'mastered', 'skipped'].forEach((value) => { const button = text(actions, 'button', value === 'learning' ? '标记学习中' : value === 'mastered' ? '已掌握' : '跳过'); button.className = 'button'; button.type = 'button'; button.addEventListener('click', () => { state.progress[item.id] = value; save(); updateStatus(); renderHistory(); }); }); }
        function renderHistory() { historyPanel.replaceChildren(); const entries = Object.entries(state.progress).filter(([, value]) => value !== 'skipped').map(([id, value]) => ({ item: state.pages.find((page) => page.id === id), value })).filter((entry) => entry.item); if (!entries.length) { historyPanel.hidden = true; return; } historyPanel.hidden = false; text(historyPanel, 'h2', '本地进度'); entries.forEach(({ item, value }) => { const row = text(historyPanel, 'div', ''); row.className = 'history-item'; const link = text(row, 'a', item.title || item.id); link.href = item.url || '#'; const stateText = text(row, 'span', value === 'mastered' ? '已掌握' : '学习中'); stateText.className = 'state'; }); }
        function pickNext() { const pool = candidates(); if (!pool.length) { state.current = ''; renderCard(); updateStatus(); status.textContent = '当前筛选没有可学习文章。'; return; } const unseen = pool.filter((item) => !state.progress[item.id] || state.progress[item.id] === 'skipped'); const source = unseen.length ? unseen : pool; const currentIndex = source.findIndex((item) => item.id === state.current); const item = source[(currentIndex + 1 + Math.floor(Math.random() * Math.max(source.length - 1, 1))) % source.length]; state.current = item.id; setUrl(); renderCard(); updateStatus(); }
        async function load() { loadSaved(); try { const response = await fetch('/api/catalog', { headers: { Accept: 'application/json' } }); const payload = await response.json(); if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`); state.pages = payload.items || []; renderTags(); if (!state.current || !state.pages.some((item) => item.id === state.current)) pickNext(); else { renderCard(); updateStatus(); } renderHistory(); } catch (error) { status.textContent = `加载失败：${error instanceof Error ? error.message : String(error)}`; status.className = 'status error'; } }
        tag.addEventListener('change', () => { state.tag = tag.value; state.current = ''; pickNext(); }); includeArchive.addEventListener('change', () => { state.includeArchive = includeArchive.checked; state.current = ''; pickNext(); }); next.addEventListener('click', pickNext); reset.addEventListener('click', () => { if (confirm('清空本地学习进度？')) { state.progress = {}; save(); updateStatus(); renderHistory(); } }); load();
      })();
    </script>
  </body>
</html>
