<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 文章检查器</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--danger:#ff8e8e;--warn:#f4c56b;--ok:#8de0a6}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}.shell{margin:auto;max-width:1280px;padding:2rem 1.25rem 4rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2.2rem;margin:0}.lead{color:var(--muted);margin:.35rem 0 1.2rem}.selector{background:var(--panel);border:1px solid var(--border);display:flex;gap:.6rem;margin-bottom:1rem;padding:.85rem}.selector input{background:var(--raised);border:1px solid var(--border);color:var(--text);min-width:0;padding:.55rem;width:100%}.selector input:focus,.button:focus-visible,.tab:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}.button,.tab{background:transparent;border:1px solid var(--accent);color:var(--accent-strong);cursor:pointer;padding:.45rem .7rem}.button:hover,.tab:hover,.tab[aria-selected="true"]{background:var(--accent);color:#17120a}.status{color:var(--muted);min-height:2rem;padding:.6rem 0}.status.error{color:var(--danger)}.tabs{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1rem}.panel{background:var(--panel);border:1px solid var(--border);padding:1rem}.panel[hidden]{display:none}.grid{display:grid;gap:1rem;grid-template-columns:minmax(14rem,.75fr) minmax(0,2fr)}.facts{border-collapse:collapse;width:100%}.facts th,.facts td{border-bottom:1px solid var(--border);padding:.55rem .35rem;text-align:left;vertical-align:top}.facts th{color:var(--muted);font-size:.82rem;font-weight:500;width:9rem}.facts td{overflow-wrap:anywhere}.description{color:var(--muted);white-space:pre-wrap}.badges{display:flex;flex-wrap:wrap;gap:.4rem}.badge{border:1px solid var(--border);color:var(--accent-strong);font-size:.78rem;padding:.16rem .42rem}.warning{border-left:3px solid var(--warn);color:var(--warn);margin:.5rem 0;padding:.35rem .65rem}.success{border-left:3px solid var(--ok);color:var(--ok);margin:.5rem 0;padding:.35rem .65rem}.code-block{background:#0c1014;border:1px solid var(--border);margin:0;max-height:60vh;overflow:auto;padding:1rem;white-space:pre-wrap;word-break:break-word}.heading-list,.template-list{display:grid;gap:.45rem;list-style:none;margin:0;padding:0}.heading-list li{border-left:2px solid var(--border);padding-left:.65rem}.heading-list li[data-level="3"]{margin-left:1rem}.heading-list li[data-level="4"]{margin-left:2rem}.link{color:var(--link);overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.empty{border:1px dashed var(--border);color:var(--muted);padding:2rem;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.selector{flex-wrap:wrap}.selector .button{width:100%}.facts th{width:7rem}}@media(max-width:500px){.shell{padding:1.25rem .85rem 3rem}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags">标签</a><a href="/relations">关系</a><a href="/practice">学习队列</a><a href="/article_inspector" aria-current="page">文章检查器</a></nav>
      <h1>文章检查器</h1>
      <p class="lead">只读查看文章元数据、frontmatter、目录结构和已经展开代码引用的 Markdown。</p>
      <form id="selector" class="selector"><input id="page-id" list="page-options" placeholder="输入文章 ID，例如 jump-lca" autocomplete="off"><datalist id="page-options"></datalist><button class="button" type="submit">加载文章</button></form>
      <div id="status" class="status" role="status" aria-live="polite">正在加载文章目录...</div>
      <div id="content" hidden>
        <div class="tabs" role="tablist" aria-label="文章检查视图"><button class="tab" data-tab="overview" role="tab">概览</button><button class="tab" data-tab="frontmatter" role="tab">frontmatter</button><button class="tab" data-tab="headings" role="tab">目录结构</button><button class="tab" data-tab="markdown" role="tab">展开后的 Markdown</button></div>
        <section id="overview" class="panel" data-panel="overview"></section>
        <section id="frontmatter" class="panel" data-panel="frontmatter" hidden></section>
        <section id="headings" class="panel" data-panel="headings" hidden></section>
        <section id="markdown" class="panel" data-panel="markdown" hidden></section>
      </div>
      <div id="empty" class="empty">请选择文章后开始检查。</div>
    </main>
    <script>
      (() => {
        const state = { catalog: [], codes: [], page: null, tab: new URLSearchParams(location.search).get('tab') || 'overview' };
        const input = document.querySelector('#page-id'); const options = document.querySelector('#page-options'); const form = document.querySelector('#selector'); const status = document.querySelector('#status'); const content = document.querySelector('#content'); const empty = document.querySelector('#empty');
        const tabs = [...document.querySelectorAll('[data-tab]')]; const panels = [...document.querySelectorAll('[data-panel]')];
        const initialId = new URLSearchParams(location.search).get('id') || '';
        function node(tag, className, value) { const element = document.createElement(tag); if (className) element.className = className; if (value !== undefined) element.textContent = String(value); return element; }
        function setUrl() { const params = new URLSearchParams(); if (state.page?.id) params.set('id', state.page.id); if (state.tab !== 'overview') params.set('tab', state.tab); history.replaceState(null, '', `${location.pathname}${params.toString() ? `?${params}` : ''}`); }
        function setStatus(message, error = false) { status.textContent = message; status.className = `status${error ? ' error' : ''}`; }
        function setTab(tab) { state.tab = tab; setUrl(); tabs.forEach((button) => button.setAttribute('aria-selected', String(button.dataset.tab === tab))); panels.forEach((panel) => { panel.hidden = panel.dataset.panel !== tab; }); }
        function addRow(table, label, value) { const row = document.createElement('tr'); row.append(node('th', '', label)); const cell = node('td'); if (value instanceof Node) cell.append(value); else cell.textContent = value == null || value === '' ? '未填写' : String(value); row.append(cell); table.append(row); }
        function link(href, label) { const a = node('a', 'link', label); a.href = href; return a; }
        function renderOverview() {
          const page = state.page; const panel = document.querySelector('#overview'); panel.replaceChildren();
          const grid = node('div', 'grid'); const table = node('table', 'facts');
          addRow(table, 'ID', page.id); addRow(table, '标题', page.title); addRow(table, 'description', page.description); addRow(table, '路径', page.path); addRow(table, '站内 URL', page.url ? link(page.url, page.url) : ''); addRow(table, 'categories', Array.isArray(page.categories) ? page.categories.join(', ') : '');
          const tags = node('div', 'badges'); (page.tags || []).forEach((item) => tags.append(node('span', 'badge', item))); addRow(table, 'tags', tags.childNodes.length ? tags : '');
          const refs = Array.isArray(page.frontMatter?.code_template) ? page.frontMatter.code_template : []; const templateList = node('ul', 'template-list'); refs.forEach((id) => { const li = node('li'); li.append(link(`/api/codes?id=${encodeURIComponent(id)}`, id)); templateList.append(li); }); addRow(table, 'code_template', refs.length ? templateList : '');
          grid.append(table); const side = node('div'); const warnings = [];
          if (!page.title) warnings.push('缺少 title'); if (!page.description) warnings.push('缺少显式 description'); if (!Array.isArray(page.tags) || page.tags.length === 0) warnings.push('缺少 tags');
          const knownCodes = new Set(state.codes.map((item) => item.id)); refs.filter((id) => !knownCodes.has(id)).forEach((id) => warnings.push(`未注册的代码模板 ID：${id}`));
          if (warnings.length) warnings.forEach((message) => side.append(node('div', 'warning', message))); else side.append(node('div', 'success', '未发现 frontmatter 基础问题。'));
          const actions = node('div', 'actions'); if (page.url) actions.append(link(page.url, '打开文章')); const copyId = node('button', 'button', '复制 ID'); copyId.type = 'button'; copyId.addEventListener('click', () => copy(page.id, 'ID 已复制')); const copyMarkdown = node('button', 'button', '复制 Markdown'); copyMarkdown.type = 'button'; copyMarkdown.addEventListener('click', () => copy(page.markdown || '', 'Markdown 已复制')); actions.append(copyId, copyMarkdown); side.append(actions); grid.append(side); panel.append(grid);
        }
        function renderFrontmatter() { const panel = document.querySelector('#frontmatter'); panel.replaceChildren(); panel.append(node('p', 'description', 'API 返回的 frontMatter 对象，使用 JSON 只读展示。')); const pre = node('pre', 'code-block', JSON.stringify(state.page.frontMatter || {}, null, 2)); panel.append(pre); }
        function renderHeadings() { const panel = document.querySelector('#headings'); panel.replaceChildren(); const list = node('ol', 'heading-list'); (state.page.headings || []).forEach((heading) => { const item = node('li', '', heading.title || heading.text || '未命名标题'); item.dataset.level = String(heading.level || 2); list.append(item); }); panel.append(list.childNodes.length ? list : node('p', 'description', '没有目录标题。')); if (state.page.navTrail?.length) panel.append(node('p', 'description', `导航路径：${state.page.navTrail.join(' / ')}`)); }
        function renderMarkdown() { const panel = document.querySelector('#markdown'); panel.replaceChildren(); panel.append(node('p', 'description', '已保留 frontmatter，并已展开 @include_md 和 @include-code；这里不执行 HTML 渲染。')); panel.append(node('pre', 'code-block', state.page.markdown || '')); }
        function render() { if (!state.page) { content.hidden = true; empty.hidden = false; return; } empty.hidden = true; content.hidden = false; renderOverview(); renderFrontmatter(); renderHeadings(); renderMarkdown(); setTab(state.tab); }
        async function copy(value, message) { try { await navigator.clipboard.writeText(value); setStatus(message); } catch { setStatus('复制失败，请手动选择文本。', true); } }
        async function loadPage(id) { if (!id) { state.page = null; render(); setStatus('请输入文章 ID。', true); return; } setStatus(`正在读取 ${id} ...`); try { const response = await fetch(`/api/pages?id=${encodeURIComponent(id)}`, { headers: { Accept: 'application/json' } }); const payload = await response.json(); if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`); state.page = payload; input.value = payload.id || id; setUrl(); render(); setStatus(`已加载：${payload.title || payload.id}`); } catch (error) { state.page = null; render(); setStatus(`加载失败：${error instanceof Error ? error.message : String(error)}`, true); } }
        async function loadCatalog() { try { const [catalogResponse, codesResponse] = await Promise.all([fetch('/api/catalog', { headers: { Accept: 'application/json' } }), fetch('/api/codes', { headers: { Accept: 'application/json' } })]); const catalog = await catalogResponse.json(); const codes = await codesResponse.json(); if (!catalogResponse.ok) throw new Error(catalog.message || `HTTP ${catalogResponse.status}`); if (!codesResponse.ok) throw new Error(codes.message || `HTTP ${codesResponse.status}`); state.catalog = Array.isArray(catalog.items) ? catalog.items : []; state.codes = Array.isArray(codes.items) ? codes.items : []; options.replaceChildren(); state.catalog.forEach((item) => { const option = node('option'); option.value = item.id || ''; option.label = item.title || item.id || ''; options.append(option); }); const id = initialId || state.catalog[0]?.id; if (id) await loadPage(id); else setStatus('目录为空。'); } catch (error) { setStatus(`目录加载失败：${error instanceof Error ? error.message : String(error)}`, true); } }
        form.addEventListener('submit', (event) => { event.preventDefault(); loadPage(input.value.trim()); }); tabs.forEach((button) => button.addEventListener('click', () => setTab(button.dataset.tab))); loadCatalog();
      })();
    </script>
  </body>
</html>
