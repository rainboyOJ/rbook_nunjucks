<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 关系浏览</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--incoming:#7dd3a7;--outgoing:#76bff2;--danger:#ff8e8e}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}button,input{font:inherit}.shell{margin:auto;max-width:1600px;padding:1.5rem 1.25rem 3rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.2rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2rem;margin:0 0 1rem}.toolbar{align-items:end;background:var(--panel);border:1px solid var(--border);display:grid;gap:.65rem;grid-template-columns:minmax(15rem,1fr) auto auto auto;padding:.75rem}.search{display:grid;gap:.25rem}.search label{color:var(--muted);font-size:.78rem}.search input{background:var(--raised);border:1px solid var(--border);color:var(--text);height:2.35rem;padding:.4rem .55rem;width:100%}.toggle{align-items:center;border:1px solid var(--border);color:var(--muted);display:flex;gap:.45rem;height:2.35rem;padding:0 .65rem;white-space:nowrap}.toggle input{accent-color:var(--accent);height:1rem;margin:0;width:1rem}.button{background:transparent;border:1px solid var(--accent);color:var(--accent-strong);cursor:pointer;height:2.35rem;padding:.35rem .7rem;white-space:nowrap}.button:hover{background:var(--accent);color:#17120a}.button:focus-visible,.search input:focus,.relation-button:focus-visible,.action:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.status{color:var(--muted);min-height:2rem;padding:.55rem 0}.status.error{color:var(--danger)}.workspace{display:grid;gap:.85rem;grid-template-columns:minmax(0,1fr) 20rem;min-height:38rem}.graph-pane{background:#0c1014;border:1px solid var(--border);display:grid;grid-template-rows:minmax(32rem,1fr) auto;min-width:0;overflow:hidden}.graph{cursor:grab;display:block;height:100%;min-height:32rem;touch-action:none;width:100%}.graph:active{cursor:grabbing}.edge{stroke:#596874;stroke-opacity:.78;stroke-width:1.35}.edge.incoming{stroke:var(--incoming);stroke-opacity:1;stroke-width:2.2}.edge.outgoing{stroke:var(--outgoing);stroke-opacity:1;stroke-width:2.2}.node{cursor:pointer}.node circle{fill:#2b3741;stroke:#a7b5c0;stroke-width:1.4}.node.unlisted circle{fill:#0c1014;stroke:#75838e;stroke-dasharray:2.5 2}.node.selected circle{fill:var(--accent);stroke:var(--accent-strong);stroke-width:2.8}.node text{fill:var(--text);font-size:12px;paint-order:stroke;pointer-events:none;stroke:#0c1014;stroke-width:3px;stroke-linejoin:round}.node.selected text{fill:var(--accent-strong);font-weight:700}.node:focus{outline:none}.node:focus circle{stroke:var(--accent-strong);stroke-width:2.5}.graph-footer{border-top:1px solid var(--border);color:var(--muted);font-size:.8rem;padding:.55rem .7rem}.legend{display:flex;flex-wrap:wrap;gap:.8rem}.legend-item{align-items:center;display:inline-flex;gap:.32rem}.dot{background:#2b3741;border:1px solid #a7b5c0;border-radius:50%;display:inline-block;height:.65rem;width:.65rem}.dot.hollow{background:transparent;border-style:dashed}.line{display:inline-block;height:2px;width:1.2rem}.line.incoming{background:var(--incoming)}.line.outgoing{background:var(--outgoing)}details{border-top:1px solid var(--border);margin-top:.55rem;padding-top:.45rem}summary{cursor:pointer}.relation-list{display:grid;gap:.25rem;list-style:none;margin:.45rem 0 0;max-height:9rem;overflow:auto;padding:0}.relation-button{background:none;border:0;color:var(--link);cursor:pointer;padding:.12rem 0;text-align:left}.detail{background:var(--panel);border:1px solid var(--border);min-width:0;overflow:auto;padding:1rem}.detail h2{color:var(--accent-strong);font-size:1.15rem;margin:0;overflow-wrap:anywhere}.detail-id{color:var(--muted);font:.78rem ui-monospace,SFMono-Regular,Menlo,monospace;margin:.2rem 0 .9rem;overflow-wrap:anywhere}.detail-description{color:var(--muted);margin:0 0 1rem}.detail h3{font-size:.78rem;font-weight:600;margin:1rem 0 .4rem;text-transform:none}.tags{display:flex;flex-wrap:wrap;gap:.35rem}.badge{border:1px solid var(--border);color:var(--accent-strong);font-size:.72rem;padding:.12rem .34rem}.relations{display:grid;gap:.3rem;list-style:none;margin:0;padding:0}.relations .relation-button{width:100%}.muted{color:var(--muted)}.actions{display:grid;gap:.5rem;grid-template-columns:1fr 1fr;margin-top:1.2rem}.action{border:1px solid var(--accent);color:var(--accent-strong);padding:.42rem .55rem;text-align:center;text-decoration:none}.action:hover{background:var(--accent);color:#17120a}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.button{width:100%}.workspace{grid-template-columns:1fr}.graph-pane{grid-template-rows:minmax(29rem,62vh) auto}.graph{min-height:29rem}.detail{max-height:none}}@media(max-width:540px){.shell{padding:1.15rem .7rem 2.5rem}h1{font-size:1.65rem}.toolbar{grid-template-columns:1fr}.search{grid-column:auto}.toggle{justify-content:center}.workspace{min-height:0}.graph-pane{grid-template-rows:minmax(25rem,58vh) auto}.graph{min-height:25rem}.legend{gap:.5rem}.actions{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags">标签</a><a href="/relations" aria-current="page">关系</a><a href="/practice">学习队列</a></nav>
      <h1>关系浏览</h1>
      <div class="toolbar">
        <div class="search"><label for="search">搜索文章</label><input id="search" list="article-options" type="search" autocomplete="off" placeholder="输入文章 ID 或标题"><datalist id="article-options"></datalist></div>
        <label class="toggle" for="show-isolated"><input id="show-isolated" type="checkbox">显示孤立文章</label>
        <button id="fit" class="button" type="button">适应视图</button>
        <button id="relayout" class="button" type="button">重新布局</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">正在加载关系数据...</div>
      <div class="workspace">
        <section class="graph-pane" aria-label="文章前置关系图">
          <svg id="graph" class="graph" role="img" aria-label="文章前置关系力导图"></svg>
          <div class="graph-footer">
            <div class="legend" aria-label="图例"><span class="legend-item"><i class="dot"></i>目录文章</span><span class="legend-item"><i class="dot hollow"></i>未列入目录</span><span class="legend-item"><i class="line incoming"></i>所选文章的前置</span><span class="legend-item"><i class="line outgoing"></i>所选文章的后续</span></div>
            <details><summary id="relation-summary">前置关系列表</summary><ul id="relation-list" class="relation-list"></ul></details>
          </div>
        </section>
        <aside id="detail" class="detail" aria-live="polite"><p class="muted">未选择文章</p></aside>
      </div>
    </main>
    <script src="/assets/vendor/d3.min.js"></script>
    <script>
      (() => {
        const d3 = window.d3;
        const params = new URLSearchParams(location.search);
        const state = { pages: [], nodesById: new Map(), connectedIds: new Set(), successors: new Map(), selectedId: params.get('id') || '', showIsolated: params.get('isolated') === '1', simulation: null, links: [], nodeSelection: null, linkSelection: null, zoom: null };
        const svgElement = document.querySelector('#graph');
        const svg = d3 ? d3.select(svgElement) : null;
        const search = document.querySelector('#search');
        const options = document.querySelector('#article-options');
        const showIsolated = document.querySelector('#show-isolated');
        const status = document.querySelector('#status');
        const detail = document.querySelector('#detail');
        const relationList = document.querySelector('#relation-list');
        const relationSummary = document.querySelector('#relation-summary');
        showIsolated.checked = state.showIsolated;

        function normalize(value) { return String(value || '').toLocaleLowerCase(); }
        function shortTitle(value) { const text = String(value || ''); return text.length > 22 ? `${text.slice(0, 21)}…` : text; }
        function setUrl() { const next = new URLSearchParams(); if (state.selectedId) next.set('id', state.selectedId); if (state.showIsolated) next.set('isolated', '1'); history.replaceState(null, '', `${location.pathname}${next.toString() ? `?${next}` : ''}`); }
        function pageById(id) { return state.nodesById.get(id); }
        function displayedNodes() { return state.pages.filter((page) => state.showIsolated || state.connectedIds.has(page.id)); }
        function rawLinks() {
          const links = [];
          state.pages.forEach((dependent) => (dependent.prerequisites || []).forEach((prerequisite) => {
            if (!state.nodesById.has(prerequisite)) return;
            if (!state.showIsolated && (!state.connectedIds.has(prerequisite) || !state.connectedIds.has(dependent.id))) return;
            links.push({ source: prerequisite, target: dependent.id });
          }));
          return links;
        }
        function dimensions() { return { width: Math.max(svgElement.clientWidth, 320), height: Math.max(svgElement.clientHeight, 400) }; }
        function marker(defs, id, color) { const item = defs.append('marker').attr('id', id).attr('viewBox', '0 -5 10 10').attr('refX', 15).attr('refY', 0).attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto'); item.append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', color); }
        function buildSvg() {
          svg.selectAll('*').remove();
          const defs = svg.append('defs'); marker(defs, 'arrow-default', '#596874'); marker(defs, 'arrow-incoming', '#7dd3a7'); marker(defs, 'arrow-outgoing', '#76bff2');
          const viewport = svg.append('g').attr('class', 'viewport');
          viewport.append('g').attr('class', 'links'); viewport.append('g').attr('class', 'nodes');
          state.zoom = d3.zoom().scaleExtent([0.15, 4]).on('zoom', (event) => viewport.attr('transform', event.transform));
          svg.call(state.zoom).on('dblclick.zoom', null);
        }
        function edgeClass(link) { const source = typeof link.source === 'string' ? link.source : link.source.id; const target = typeof link.target === 'string' ? link.target : link.target.id; if (target === state.selectedId) return 'edge incoming'; if (source === state.selectedId) return 'edge outgoing'; return 'edge'; }
        function edgeMarker(link) { const className = edgeClass(link); return className.includes('incoming') ? 'url(#arrow-incoming)' : className.includes('outgoing') ? 'url(#arrow-outgoing)' : 'url(#arrow-default)'; }
        function updateSelection() {
          if (!state.nodeSelection) return;
          state.nodeSelection.classed('selected', (node) => node.id === state.selectedId);
          state.linkSelection.attr('class', edgeClass).attr('marker-end', edgeMarker);
        }
        function ticked() {
          state.linkSelection.attr('x1', (link) => link.source.x).attr('y1', (link) => link.source.y).attr('x2', (link) => link.target.x).attr('y2', (link) => link.target.y);
          state.nodeSelection.attr('transform', (node) => `translate(${node.x},${node.y})`);
        }
        function dragBehavior() {
          return d3.drag()
            .on('start', (event, node) => { if (!event.active) state.simulation.alphaTarget(.25).restart(); node.fx = node.x; node.fy = node.y; })
            .on('drag', (event, node) => { node.fx = event.x; node.fy = event.y; })
            .on('end', (event) => { if (!event.active) state.simulation.alphaTarget(0); });
        }
        function fitView(duration = 350) {
          const viewport = svg.select('.viewport').node();
          if (!viewport || !state.nodeSelection || state.nodeSelection.empty()) return;
          const box = viewport.getBBox(); const size = dimensions();
          if (!box.width || !box.height) return;
          const scale = Math.max(.15, Math.min(2.2, .88 / Math.max(box.width / size.width, box.height / size.height)));
          const transform = d3.zoomIdentity.translate(size.width / 2, size.height / 2).scale(scale).translate(-(box.x + box.width / 2), -(box.y + box.height / 2));
          svg.transition().duration(duration).call(state.zoom.transform, transform);
        }
        function centerNode(id) {
          const node = pageById(id); if (!node || !Number.isFinite(node.x)) return;
          const size = dimensions(); const current = d3.zoomTransform(svgElement); const scale = Math.max(current.k, 1.15);
          svg.transition().duration(350).call(state.zoom.transform, d3.zoomIdentity.translate(size.width / 2 - node.x * scale, size.height / 2 - node.y * scale).scale(scale));
        }
        function relationButton(item) { const button = document.createElement('button'); button.className = 'relation-button'; button.type = 'button'; button.textContent = `${item.title || item.id} (${item.id})`; button.addEventListener('click', () => selectNode(item.id, true)); return button; }
        function relationSection(title, ids) { const heading = document.createElement('h3'); heading.textContent = title; detail.append(heading); const list = document.createElement('ul'); list.className = 'relations'; if (!ids.length) { const empty = document.createElement('li'); empty.className = 'muted'; empty.textContent = '无'; list.append(empty); } else ids.map(pageById).filter(Boolean).sort((a, b) => String(a.title).localeCompare(String(b.title), 'zh-CN')).forEach((item) => { const row = document.createElement('li'); row.append(relationButton(item)); list.append(row); }); detail.append(list); }
        function renderDetail() {
          detail.replaceChildren(); const page = pageById(state.selectedId);
          if (!page) { const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = '未选择文章'; detail.append(empty); return; }
          const title = document.createElement('h2'); title.textContent = page.title || page.id; const id = document.createElement('div'); id.className = 'detail-id'; id.textContent = page.id; const description = document.createElement('p'); description.className = 'detail-description'; description.textContent = page.description || '未填写描述'; detail.append(title, id, description);
          const tagTitle = document.createElement('h3'); tagTitle.textContent = '标签'; const tags = document.createElement('div'); tags.className = 'tags'; const values = Array.isArray(page.tags) ? page.tags : []; if (!values.length) tags.textContent = '无'; else values.forEach((value) => { const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = value; tags.append(badge); }); detail.append(tagTitle, tags);
          relationSection('直接前置', page.prerequisites || []); relationSection('直接后续', [...(state.successors.get(page.id) || [])]);
          const actions = document.createElement('div'); actions.className = 'actions'; const open = document.createElement('a'); open.className = 'action'; open.href = page.url || '#'; open.textContent = '打开文章'; const inspect = document.createElement('a'); inspect.className = 'action'; inspect.href = `/article_inspector?id=${encodeURIComponent(page.id)}`; inspect.textContent = '检查文章'; actions.append(open, inspect); detail.append(actions);
        }
        function renderRelationList() {
          relationList.replaceChildren(); const links = rawLinks(); relationSummary.textContent = `前置关系列表 (${links.length})`;
          links.sort((a, b) => String(a.source).localeCompare(String(b.source)) || String(a.target).localeCompare(String(b.target))).forEach((link) => { const source = pageById(link.source); const target = pageById(link.target); const row = document.createElement('li'); const button = document.createElement('button'); button.className = 'relation-button'; button.type = 'button'; button.textContent = `${source?.title || link.source} → ${target?.title || link.target}`; button.addEventListener('click', () => selectNode(link.target, true)); row.append(button); relationList.append(row); });
          if (!links.length) { const row = document.createElement('li'); row.className = 'muted'; row.textContent = '没有前置关系'; relationList.append(row); }
        }
        function renderGraph({ fit = false } = {}) {
          if (!d3) { status.textContent = '关系图依赖加载失败。'; status.className = 'status error'; return; }
          if (state.simulation) state.simulation.stop();
          const nodes = displayedNodes(); const links = rawLinks(); const size = dimensions(); svg.attr('viewBox', `0 0 ${size.width} ${size.height}`);
          state.linkSelection = svg.select('.links').selectAll('line').data(links, (link) => `${link.source}->${link.target}`).join('line').attr('class', edgeClass).attr('marker-end', edgeMarker);
          state.nodeSelection = svg.select('.nodes').selectAll('g').data(nodes, (node) => node.id).join((enter) => { const group = enter.append('g').attr('class', 'node').attr('tabindex', 0).attr('role', 'button'); group.append('circle').attr('r', 7); group.append('text').attr('x', 11).attr('y', 4); return group; }).attr('class', (node) => `node${node.visible === false ? ' unlisted' : ''}${node.id === state.selectedId ? ' selected' : ''}`).attr('aria-label', (node) => `${node.title || node.id}，ID ${node.id}`).on('click', (event, node) => selectNode(node.id, true)).on('keydown', (event, node) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectNode(node.id, true); } }).call(dragBehavior());
          state.nodeSelection.select('text').text((node) => shortTitle(node.title || node.id));
          state.simulation = d3.forceSimulation(nodes).force('link', d3.forceLink(links).id((node) => node.id).distance(135).strength(.85)).force('charge', d3.forceManyBody().strength(state.showIsolated ? -115 : -360)).force('center', d3.forceCenter(size.width / 2, size.height / 2)).force('collision', d3.forceCollide().radius(30)).alphaDecay(.035).on('tick', ticked);
          state.links = links; for (let i = 0; i < (state.showIsolated ? 45 : 100); i += 1) state.simulation.tick(); ticked(); state.simulation.alpha(.4).restart();
          status.className = 'status'; status.textContent = `${nodes.length} 篇文章，${links.length} 条前置关系`;
          renderRelationList(); updateSelection(); renderDetail(); setUrl(); if (fit) requestAnimationFrame(() => fitView(0));
        }
        function selectNode(id, center) {
          if (!state.nodesById.has(id)) return;
          if (!state.showIsolated && !state.connectedIds.has(id)) { state.showIsolated = true; showIsolated.checked = true; state.selectedId = id; renderGraph({ fit: false }); }
          else { state.selectedId = id; updateSelection(); renderDetail(); setUrl(); }
          search.value = id; if (center) requestAnimationFrame(() => centerNode(id));
        }
        function searchArticle() { const value = normalize(search.value.trim()); if (!value) return; const exact = state.pages.find((page) => normalize(page.id) === value || normalize(page.title) === value); const partial = state.pages.find((page) => normalize(page.id).includes(value) || normalize(page.title).includes(value)); const match = exact || partial; if (match) selectNode(match.id, true); else { status.textContent = `没有找到文章：${search.value.trim()}`; status.className = 'status error'; } }
        function populateSearch() { options.replaceChildren(); state.pages.slice().sort((a, b) => String(a.title).localeCompare(String(b.title), 'zh-CN')).forEach((page) => { const option = document.createElement('option'); option.value = page.id; option.label = page.title || page.id; options.append(option); }); }
        function relayout() { const size = dimensions(); displayedNodes().forEach((node) => { node.fx = null; node.fy = null; node.x = size.width / 2 + (Math.random() - .5) * size.width * .7; node.y = size.height / 2 + (Math.random() - .5) * size.height * .7; node.vx = 0; node.vy = 0; }); state.simulation.alpha(1).restart(); setTimeout(() => fitView(), 350); }
        async function load() {
          if (!d3) { status.textContent = '关系图依赖加载失败。'; status.className = 'status error'; return; }
          try {
            const response = await fetch('/api/catalog?includeHidden=true', { headers: { Accept: 'application/json' } }); const payload = await response.json(); if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`);
            state.pages = Array.isArray(payload.items) ? payload.items : []; state.pages.forEach((page) => { page.prerequisites = Array.isArray(page.prerequisites) ? page.prerequisites : []; state.nodesById.set(page.id, page); state.successors.set(page.id, new Set()); });
            state.pages.forEach((page) => page.prerequisites.forEach((id) => { if (!state.nodesById.has(id)) return; state.connectedIds.add(id); state.connectedIds.add(page.id); state.successors.get(id).add(page.id); }));
            if (state.selectedId && !state.nodesById.has(state.selectedId)) state.selectedId = ''; if (state.selectedId && !state.connectedIds.has(state.selectedId)) { state.showIsolated = true; showIsolated.checked = true; }
            populateSearch(); buildSvg(); renderGraph({ fit: true }); if (state.selectedId) { search.value = state.selectedId; requestAnimationFrame(() => centerNode(state.selectedId)); }
          } catch (error) { status.textContent = `加载关系数据失败：${error instanceof Error ? error.message : String(error)}`; status.className = 'status error'; }
        }
        search.addEventListener('change', searchArticle); search.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); searchArticle(); } });
        showIsolated.addEventListener('change', () => { state.showIsolated = showIsolated.checked; renderGraph({ fit: true }); });
        document.querySelector('#fit').addEventListener('click', () => fitView()); document.querySelector('#relayout').addEventListener('click', relayout);
        window.addEventListener('resize', () => { if (!state.simulation) return; const size = dimensions(); svg.attr('viewBox', `0 0 ${size.width} ${size.height}`); state.simulation.force('center', d3.forceCenter(size.width / 2, size.height / 2)).alpha(.2).restart(); });
        load();
      })();
    </script>
  </body>
</html>
