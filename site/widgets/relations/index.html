<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 关系浏览</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--danger:#ff8e8e}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}.shell{margin:auto;max-width:1280px;padding:2rem 1.25rem 4rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2.2rem;margin:0}.lead{color:var(--muted);margin:.35rem 0 1.2rem}.controls{background:var(--panel);border:1px solid var(--border);display:grid;gap:.65rem;grid-template-columns:10rem minmax(12rem,1fr) 9rem auto;padding:.9rem}.controls label{color:var(--muted);font-size:.8rem}.control{display:grid;gap:.25rem}.control input,.control select{background:var(--raised);border:1px solid var(--border);color:var(--text);min-height:2.5rem;padding:.45rem .6rem;width:100%}.control input:focus,.control select:focus,.button:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}.button{align-self:end;background:transparent;border:1px solid var(--accent);color:var(--accent-strong);cursor:pointer;min-height:2.5rem;padding:.45rem .7rem}.button:hover{background:var(--accent);color:#17120a}.status{color:var(--muted);min-height:2rem;padding:.55rem 0}.status.error{color:var(--danger)}.workspace{display:grid;gap:1rem;grid-template-columns:minmax(0,1.6fr) minmax(18rem,.8fr)}.panel{background:var(--panel);border:1px solid var(--border);min-width:0;padding:1rem}.panel h2{font-size:1rem;margin:0 0 .8rem}.graph-wrap{overflow:auto}.graph{background:#0c1014;border:1px solid var(--border);display:block;min-height:350px;min-width:720px}.graph line{stroke:#53616d;stroke-width:1.5}.graph .node{cursor:pointer}.graph .node rect{fill:var(--raised);stroke:var(--border)}.graph .node.seed rect{fill:#3d3119;stroke:var(--accent)}.graph .node text{fill:var(--text);font-size:13px}.legend{color:var(--muted);display:flex;flex-wrap:wrap;gap:.7rem;font-size:.8rem;margin-top:.7rem}.legend span{border-left:3px solid var(--accent);padding-left:.35rem}.relation-list{display:grid;gap:.6rem;list-style:none;margin:0;padding:0}.relation-list li{border-bottom:1px solid var(--border);padding-bottom:.6rem}.relation-list strong{color:var(--accent-strong)}.relation-list small{color:var(--muted);display:block;overflow-wrap:anywhere}.link{color:var(--link);overflow-wrap:anywhere}.empty{border:1px dashed var(--border);color:var(--muted);padding:2rem;text-align:center}.notice{border-left:3px solid var(--accent);color:var(--muted);margin:.75rem 0;padding:.35rem .65rem}@media(max-width:820px){.controls{grid-template-columns:1fr 1fr}.control:nth-child(2){grid-column:1/-1}.controls .button{width:100%}.workspace{grid-template-columns:1fr}}@media(max-width:500px){.shell{padding:1.25rem .85rem 3rem}.controls{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags">标签</a><a href="/relations" aria-current="page">关系</a><a href="/practice">学习队列</a></nav>
      <h1>关系浏览</h1>
      <p class="lead">选择一篇文章、一个代码模板或一个标签，查看局部关系。默认只展开一跳，避免全量关系图遮挡信息。</p>
      <form id="controls" class="controls"><div class="control"><label for="seed-type">种子类型</label><select id="seed-type"><option value="article">文章</option><option value="code">代码模板</option><option value="tag">标签</option></select></div><div class="control"><label for="seed">种子 ID 或名称</label><input id="seed" list="seed-options" autocomplete="off" placeholder="例如 jump-lca"><datalist id="seed-options"></datalist></div><div class="control"><label for="depth">展开层数</label><select id="depth"><option value="1">一跳</option><option value="2">两跳</option></select></div><button class="button" type="submit">显示关系</button></form>
      <div id="status" class="status" role="status" aria-live="polite">请选择种子。</div>
      <div id="workspace" class="workspace" hidden><section class="panel"><h2>关系图</h2><div class="graph-wrap"><svg id="graph" class="graph" role="img" aria-label="局部关系图"></svg></div><div class="legend"><span>文章</span><span>代码模板</span><span>标签</span></div><div id="notice"></div></section><section class="panel"><h2>关系列表</h2><ul id="relations" class="relation-list"></ul></section></div>
      <div id="empty" class="empty">关系图不会默认加载全量节点，请先选择一个种子。</div>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search); const state = { pages: [], codes: [], seedType: params.get('type') || 'article', seedId: params.get('seed') || '', depth: Number(params.get('depth') || 1) }; const MAX_NODES = 80;
        const form = document.querySelector('#controls'); const seedType = document.querySelector('#seed-type'); const seed = document.querySelector('#seed'); const depth = document.querySelector('#depth'); const options = document.querySelector('#seed-options'); const status = document.querySelector('#status'); const workspace = document.querySelector('#workspace'); const empty = document.querySelector('#empty'); const graph = document.querySelector('#graph'); const relationList = document.querySelector('#relations'); const notice = document.querySelector('#notice');
        seedType.value = state.seedType; depth.value = String(state.depth); seed.value = state.seedId;
        function label(type) { return type === 'article' ? '文章' : type === 'code' ? '代码模板' : '标签'; }
        function key(type, id) { return `${type}:${id}`; }
        function addNode(nodes, type, id, data = {}) { if (!id) return; const nodeKey = key(type, id); if (!nodes.has(nodeKey)) nodes.set(nodeKey, { key: nodeKey, type, id, data }); }
        function addEdge(edges, from, to, relation) { if (!from || !to || from === to) return; const value = [from, to].sort().join('|') + `|${relation}`; edges.set(value, { from, to, relation }); }
        function page(id) { return state.pages.find((item) => item.id === id); }
        function code(id) { return state.codes.find((item) => item.id === id); }
        function neighbours(type, id) { const result = []; if (type === 'article') { const item = page(id); (item?.codeTemplates || []).forEach((codeId) => result.push({ type: 'code', id: codeId, relation: '引用模板' })); (item?.tags || []).forEach((tag) => result.push({ type: 'tag', id: tag, relation: '拥有标签' })); } else if (type === 'code') { const item = code(id); const articleIds = Array.isArray(item?.articles) ? item.articles.map((article) => article.id) : state.pages.filter((item) => (item.codeTemplates || []).includes(id)).map((item) => item.id); articleIds.forEach((articleId) => result.push({ type: 'article', id: articleId, relation: '被文章引用' })); (item?.tags || []).forEach((tag) => result.push({ type: 'tag', id: tag, relation: '拥有标签' })); } else { state.pages.filter((item) => (item.tags || []).includes(id)).forEach((item) => result.push({ type: 'article', id: item.id, relation: '文章标签' })); state.codes.filter((item) => (item.tags || []).includes(id)).forEach((item) => result.push({ type: 'code', id: item.id, relation: '模板标签' })); } return result; }
        function buildGraph() { const nodes = new Map(); const edges = new Map(); if (!state.seedId) return { nodes, edges, truncated: false }; addNode(nodes, state.seedType, state.seedId); let frontier = [{ type: state.seedType, id: state.seedId }]; let truncated = false; for (let level = 0; level < state.depth; level += 1) { const next = []; frontier.forEach((current) => neighbours(current.type, current.id).forEach((item) => { const from = key(current.type, current.id); const to = key(item.type, item.id); if (nodes.size >= MAX_NODES && !nodes.has(to)) { truncated = true; return; } addNode(nodes, item.type, item.id); addEdge(edges, from, to, item.relation); next.push({ type: item.type, id: item.id }); })); frontier = [...new Map(next.map((item) => [key(item.type, item.id), item])).values()]; if (!frontier.length) break; } return { nodes, edges, truncated }; }
        function short(value) { const text = String(value); return text.length > 26 ? `${text.slice(0, 25)}…` : text; }
        function svgText(x, y, value) { const node = document.createElementNS('http://www.w3.org/2000/svg', 'text'); node.setAttribute('x', String(x)); node.setAttribute('y', String(y)); node.setAttribute('text-anchor', 'middle'); node.textContent = short(value); return node; }
        function renderGraph(model) { graph.replaceChildren(); const groups = { article: [], code: [], tag: [] }; [...model.nodes.values()].forEach((item) => groups[item.type].push(item)); const positions = new Map(); const columns = { article: 150, code: 480, tag: 810 }; const height = Math.max(360, Math.max(...Object.values(groups).map((items) => items.length), 1) * 72 + 80); graph.setAttribute('viewBox', `0 0 960 ${height}`); Object.entries(groups).forEach(([type, items]) => items.forEach((item, index) => { positions.set(item.key, { x: columns[type], y: 55 + index * 72 }); })); [...model.edges.values()].forEach((edge) => { const from = positions.get(edge.from); const to = positions.get(edge.to); if (!from || !to) return; const line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('x1', String(from.x)); line.setAttribute('y1', String(from.y)); line.setAttribute('x2', String(to.x)); line.setAttribute('y2', String(to.y)); line.setAttribute('aria-label', edge.relation); graph.append(line); }); [...model.nodes.values()].forEach((item) => { const position = positions.get(item.key); const group = document.createElementNS('http://www.w3.org/2000/svg', 'g'); group.classList.add('node'); if (item.key === key(state.seedType, state.seedId)) group.classList.add('seed'); group.setAttribute('tabindex', '0'); group.setAttribute('role', 'button'); group.setAttribute('aria-label', `${label(item.type)} ${item.id}`); const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); rect.setAttribute('x', String(position.x - 105)); rect.setAttribute('y', String(position.y - 22)); rect.setAttribute('width', '210'); rect.setAttribute('height', '44'); rect.setAttribute('rx', '4'); group.append(rect, svgText(position.x, position.y + 5, item.id)); const choose = () => { state.seedType = item.type; state.seedId = item.id; seedType.value = item.type; seed.value = item.id; render(); }; group.addEventListener('click', choose); group.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(); } }); graph.append(group); }); }
        function renderList(model) { relationList.replaceChildren(); [...model.edges.values()].forEach((edge) => { const item = document.createElement('li'); const from = edge.from.split(':').slice(1).join(':'); const to = edge.to.split(':').slice(1).join(':'); const strong = document.createElement('strong'); strong.textContent = `${from} → ${to}`; const small = document.createElement('small'); small.textContent = edge.relation; item.append(strong, small); relationList.append(item); }); if (!relationList.childNodes.length) { const item = document.createElement('li'); item.className = 'empty'; item.textContent = '没有找到关联节点。'; relationList.append(item); } }
        function setUrl() { const next = new URLSearchParams(); if (state.seedId) next.set('seed', state.seedId); if (state.seedType !== 'article') next.set('type', state.seedType); if (state.depth !== 1) next.set('depth', String(state.depth)); history.replaceState(null, '', `${location.pathname}${next.toString() ? `?${next}` : ''}`); }
        function render() { setUrl(); const model = buildGraph(); if (!state.seedId) { workspace.hidden = true; empty.hidden = false; status.textContent = '请选择种子。'; return; } workspace.hidden = false; empty.hidden = true; status.textContent = `${model.nodes.size} 个节点，${model.edges.size} 条关系`; notice.replaceChildren(); if (model.truncated) { const item = document.createElement('div'); item.className = 'notice'; item.textContent = `节点超过 ${MAX_NODES} 个，已截断；请缩小展开范围或换一个种子。`; notice.append(item); } renderGraph(model); renderList(model); }
        function renderOptions() { options.replaceChildren(); let values = []; if (seedType.value === 'article') values = state.pages.map((item) => [item.id, item.title]); else if (seedType.value === 'code') values = state.codes.map((item) => [item.id, item.description]); else values = [...new Set([...state.pages.flatMap((item) => item.tags || []), ...state.codes.flatMap((item) => item.tags || [])])].map((item) => [item, item]); values.sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'zh-CN')).forEach(([value, labelValue]) => { const option = document.createElement('option'); option.value = value; option.label = labelValue; options.append(option); }); }
        async function load() { try { const responses = await Promise.all(['/api/catalog', '/api/codes'].map((url) => fetch(url, { headers: { Accept: 'application/json' } }))); const payloads = await Promise.all(responses.map((response) => response.json())); const bad = responses.findIndex((response) => !response.ok); if (bad >= 0) throw new Error(payloads[bad].message || `HTTP ${responses[bad].status}`); state.pages = payloads[0].items || []; state.codes = payloads[1].items || []; renderOptions(); render(); } catch (error) { status.textContent = `加载关系数据失败：${error instanceof Error ? error.message : String(error)}`; status.className = 'status error'; } }
        seedType.addEventListener('change', () => { state.seedType = seedType.value; seed.value = ''; state.seedId = ''; renderOptions(); render(); }); form.addEventListener('submit', (event) => { event.preventDefault(); state.seedType = seedType.value; state.seedId = seed.value.trim(); state.depth = Number(depth.value); render(); }); load();
      })();
    </script>
  </body>
</html>
