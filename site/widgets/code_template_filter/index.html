<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 代码模板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: #171d23;
        --panel-raised: #1e262e;
        --border: #34414d;
        --text: #e7edf2;
        --muted: #98a6b3;
        --accent: #ffc857;
        --accent-strong: #ffe08a;
        --link: #79c7ff;
        --danger: #ff8e8e;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 320px;
      }

      button, input { font: inherit; }

      .page-shell {
        margin: 0 auto;
        max-width: 1280px;
        padding: 2.5rem 1.5rem 4rem;
      }

      .page-header {
        align-items: end;
        display: flex;
        gap: 1.5rem;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      h1 {
        color: var(--accent-strong);
        font-size: clamp(1.7rem, 4vw, 2.5rem);
        letter-spacing: 0.04em;
        margin: 0;
      }

      .page-meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0.45rem 0 0;
      }

      .search-box {
        background: var(--panel);
        border: 1px solid var(--border);
        display: flex;
        margin-bottom: 1rem;
        max-width: 720px;
      }

      .search-label {
        align-items: center;
        background: var(--panel-raised);
        color: var(--accent-strong);
        display: flex;
        font-weight: 700;
        padding: 0 1rem;
        white-space: nowrap;
      }

      #search-input {
        background: transparent;
        border: 0;
        color: var(--text);
        min-width: 0;
        outline: 0;
        padding: 0.85rem 1rem;
        width: 100%;
      }

      #search-input::placeholder { color: var(--muted); }

      #search-input:focus { box-shadow: inset 0 0 0 2px var(--accent); }

      .filter-bar {
        background: var(--panel);
        border: 1px solid var(--border);
        display: flex;
        margin-bottom: 1rem;
        max-width: 720px;
      }

      .filter-options {
        align-items: center;
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        gap: 0.35rem 1.15rem;
        min-width: 0;
        padding: 0.55rem 1rem;
      }

      .filter-chip {
        align-items: center;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        font-size: 0.85rem;
        gap: 0.4rem;
        user-select: none;
        white-space: nowrap;
      }

      .filter-chip:hover { color: var(--accent-strong); }

      /* 当前关键词下该语言没有任何模板时淡出，但仍可勾选。 */
      .filter-chip.zero { opacity: 0.45; }

      .filter-chip input {
        accent-color: var(--accent);
        cursor: pointer;
        height: 0.95rem;
        margin: 0;
        width: 0.95rem;
      }

      .filter-chip input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .filter-chip .lang-icon { height: 1.05rem; width: 1.05rem; }

      .filter-chip .count {
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }

      #status {
        color: var(--muted);
        min-height: 1.5rem;
      }

      #status.error { color: var(--danger); }

      #result {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .template-card {
        background: var(--panel);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 1rem;
        transition: border-color 160ms ease, transform 160ms ease;
      }

      .template-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .card-heading {
        align-items: start;
        display: flex;
        gap: 0.7rem;
      }

      /* 语言图标独占原序号槽位：小、无文字，悬停 title 提示语言名。 */
      .lang-icon {
        align-items: center;
        display: inline-flex;
        flex: 0 0 auto;
        height: 1.35rem;
        width: 1.35rem;
      }

      .lang-icon svg { display: block; height: 100%; width: 100%; }

      /* 序号缩到右下角：小号、暗色，margin-left:auto 推到操作行最右端。 */
      .card-number {
        align-self: center;
        color: var(--muted);
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        margin-left: auto;
        opacity: 0.75;
        padding-left: 0.5rem;
      }

      .card-title {
        color: var(--text);
        font-size: 1.05rem;
        line-height: 1.4;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .card-id {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        margin: 0.45rem 0 0;
        overflow-wrap: anywhere;
      }

      .card-details {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }

      .badge {
        border: 1px solid var(--border);
        color: var(--accent-strong);
        font-size: 0.78rem;
        padding: 0.2rem 0.45rem;
      }

      .article-list {
        border-top: 1px solid var(--border);
        display: grid;
        gap: 0.3rem;
        margin-top: auto;
        padding-top: 0.75rem;
      }

      .article-list-label {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .article-list a {
        color: var(--link);
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .article-list a:hover { text-decoration: underline; }

      .article-empty { color: var(--muted); }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 1rem;
      }

      .action-button {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent-strong);
        cursor: pointer;
        padding: 0.42rem 0.7rem;
      }

      .action-button:hover,
      .action-button:focus-visible {
        background: var(--accent);
        color: #17120a;
        outline: 0;
      }

      .empty-state {
        background: var(--panel);
        border: 1px dashed var(--border);
        color: var(--muted);
        grid-column: 1 / -1;
        padding: 2rem;
        text-align: center;
      }

      .modal-backdrop[hidden] { display: none; }

      .modal-backdrop {
        align-items: center;
        background: rgb(0 0 0 / 78%);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 1rem;
        position: fixed;
        z-index: 10;
      }

      .modal {
        background: var(--panel);
        border: 1px solid var(--accent);
        display: flex;
        flex-direction: column;
        max-height: 92vh;
        max-width: 1100px;
        width: 100%;
      }

      .modal-header,
      .modal-actions {
        align-items: center;
        background: var(--panel-raised);
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
        padding: 0.8rem 1rem;
      }

      .modal-header { border-bottom: 1px solid var(--border); }

      .modal-title {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .modal-close {
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.6rem;
        line-height: 1;
      }

      .modal-close:hover { color: var(--accent-strong); }

      .modal-actions {
        border-top: 1px solid var(--border);
        justify-content: start;
      }

      .modal-code {
        margin: 0;
        overflow: auto;
        padding: 1rem;
      }

      .modal-code code { display: block; min-width: max-content; }

      #toast-region {
        bottom: 1rem;
        display: grid;
        gap: 0.5rem;
        position: fixed;
        right: 1rem;
        z-index: 20;
      }

      .toast {
        background: var(--panel-raised);
        border: 1px solid var(--accent);
        color: var(--text);
        max-width: min(28rem, calc(100vw - 2rem));
        padding: 0.65rem 0.85rem;
      }

      @media (max-width: 900px) {
        #result { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 620px) {
        .page-shell { padding: 1.5rem 1rem 3rem; }
        .page-header { align-items: start; flex-direction: column; gap: 0.25rem; }
        #result { grid-template-columns: 1fr; }
        .search-box, .filter-bar { max-width: none; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <h1>代码模板</h1>
          <p class="page-meta">从 rbook 代码库中查找、复制和下载可复用模板</p>
        </div>
      </header>

      <label class="search-box" for="search-input">
        <span class="search-label">搜索</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="输入多个关键词，用空格分隔">
      </label>

      <div class="filter-bar" role="group" aria-label="按语言筛选">
        <span class="search-label">语言</span>
        <div class="filter-options" id="filter-options"></div>
      </div>

      <div id="status" role="status" aria-live="polite">正在加载代码模板...</div>
      <ul id="result" aria-live="polite"></ul>
    </main>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <h2 id="modal-title" class="modal-title">代码模板</h2>
          <button id="modal-close" class="modal-close" type="button" aria-label="关闭">&times;</button>
        </header>
        <pre class="modal-code"><code id="modal-code" class="language-none"></code></pre>
        <footer class="modal-actions">
          <button class="action-button" type="button" data-modal-action="copy">复制代码</button>
          <button class="action-button" type="button" data-modal-action="download">下载</button>
        </footer>
      </section>
    </div>
    <div id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>

    <script>
      (() => {
        const state = {
          templates: [],
          selected: null,
          selectedContent: '',
          detailCache: new Map(),
          langFilter: new Set(),   // 勾选的语言原始码集合；空集 = 不限语言
          langChips: new Map()     // 语言原始码 -> { checkbox, count }，筛选条的 DOM 引用
        };

        const result = document.querySelector('#result');
        const searchInput = document.querySelector('#search-input');
        const filterOptions = document.querySelector('#filter-options');
        const status = document.querySelector('#status');
        const modalBackdrop = document.querySelector('#modal-backdrop');
        const modalTitle = document.querySelector('#modal-title');
        const modalCode = document.querySelector('#modal-code');
        const toastRegion = document.querySelector('#toast-region');

        function setStatus(message, isError = false) {
          status.textContent = message;
          status.classList.toggle('error', isError);
        }

        function showToast(message) {
          const toast = document.createElement('div');
          toast.className = 'toast';
          toast.textContent = message;
          toastRegion.append(toast);
          window.setTimeout(() => toast.remove(), 2800);
        }

        async function requestJson(url) {
          const response = await fetch(url, { headers: { Accept: 'application/json' } });
          let payload = null;
          try {
            payload = await response.json();
          } catch {
            payload = null;
          }
          if (!response.ok) {
            throw new Error(payload && payload.message ? payload.message : `HTTP ${response.status}`);
          }
          return payload || {};
        }

        async function loadTemplates() {
          const firstPage = await requestJson('/api/codes');
          const templates = Array.isArray(firstPage.items) ? [...firstPage.items] : [];
          const total = Number.isFinite(Number(firstPage.total)) ? Number(firstPage.total) : templates.length;

          // Older servers may still paginate the default response. Keep the page compatible with them.
          while (templates.length < total) {
            const nextPage = await requestJson(`/api/codes?limit=50&offset=${templates.length}`);
            const nextItems = Array.isArray(nextPage.items) ? nextPage.items : [];
            if (nextItems.length === 0) break;
            templates.push(...nextItems);
          }

          state.templates = templates;
          buildFilterBar();
          restoreLangFromUrl();
          render();
        }

        function normalize(value) {
          return String(value || '').toLocaleLowerCase();
        }

        // 语言原始码（code.yaml 的 language 字段）-> 品牌图标（Simple Icons，CC0）。
        // 颜色是深色主题下调过的品牌色，保证在卡片底色上可辨认。

          bash: {

            color: '#7cc87c',
            path: 'M21.038 4.9L13.461.402a2.86 2.86 0 0 0-2.923.001L2.961 4.9A3.02 3.02 0 0 0 1.5 7.503v8.995c0 1.073.557 2.066 1.462 2.603l7.577 4.497a2.86 2.86 0 0 0 2.922 0l7.577-4.497a3.02 3.02 0 0 0 1.462-2.603V7.503A3.02 3.02 0 0 0 21.038 4.9M15.17 18.946l.013.646c.001.078-.05.167-.111.198l-.383.22c-.061.031-.111-.007-.112-.085l-.007-.635c-.328.136-.66.169-.872.084c-.04-.016-.057-.075-.041-.142l.139-.584a.24.24 0 0 1 .069-.121a.2.2 0 0 1 .036-.026q.033-.017.062-.006c.229.077.521.041.802-.101c.357-.181.596-.545.592-.907c-.003-.328-.181-.465-.613-.468c-.55.001-1.064-.107-1.072-.917c-.007-.667.34-1.361.889-1.8l-.007-.652c-.001-.08.048-.168.111-.2l.37-.236c.061-.031.111.007.112.087l.006.653c.273-.109.511-.138.726-.088c.047.012.067.076.048.151l-.144.578a.26.26 0 0 1-.065.116a.2.2 0 0 1-.038.028a.1.1 0 0 1-.057.009c-.098-.022-.332-.073-.699.113c-.385.195-.52.53-.517.778c.003.297.155.387.681.396c.7.012 1.003.318 1.01 1.023c.007.689-.362 1.433-.928 1.888m3.973-1.087c0 .06-.008.116-.058.145l-1.916 1.164c-.05.029-.09.004-.09-.056v-.494c0-.06.037-.093.087-.122l1.887-1.129c.05-.029.09-.004.09.056zm1.316-11.062l-7.168 4.427c-.894.523-1.553 1.109-1.553 2.187v8.833c0 .645.26 1.063.66 1.184a2.3 2.3 0 0 1-.398.039c-.42 0-.833-.114-1.197-.33L3.226 18.64a2.5 2.5 0 0 1-1.201-2.142V7.503c0-.881.46-1.702 1.201-2.142L10.803.863a2.34 2.34 0 0 1 2.394 0l7.577 4.498a2.48 2.48 0 0 1 1.164 1.732c-.252-.536-.818-.682-1.479-.296'
          }
        };

        // 原始码的常见别名也归一到品牌图标；都不认识就回退通用 </> 图标。
        const LANGUAGE_ALIASES = {
          'c++': 'cpp', cc: 'cpp', cxx: 'cpp',
          py: 'python', python3: 'python',
          hs: 'haskell',
          sh: 'bash', shell: 'bash', zsh: 'bash'
        };

        const GENERIC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/><line x1="13.4" y1="5.5" x2="10.6" y2="18.5"/></svg>';

        // 筛选/URL 用的语言键：language 字段的小写原始码；缺失时用 'unknown'。
        function langKey(item) {
          return normalize(item.language) || 'unknown';
        }

        function languageMeta(raw) {
          const key = normalize(raw);
          return LANGUAGE_ICONS[LANGUAGE_ALIASES[key] || key] || null;
        }

        function languageLabel(raw) {
          const meta = languageMeta(raw);
          return meta ? meta.label : (raw ? String(raw) : '未知语言');
        }

        // 卡片/筛选条共用的语言图标；未知语言回退通用 </> 图标。
        function languageIcon(raw) {
          const meta = languageMeta(raw);
          const label = languageLabel(raw);
          const icon = document.createElement('span');
          icon.className = 'lang-icon';
          icon.style.color = meta ? meta.color : 'var(--muted)';
          icon.title = label;
          icon.setAttribute('role', 'img');
          icon.setAttribute('aria-label', label);
          icon.innerHTML = meta
            ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${meta.path}"/></svg>`
            : GENERIC_ICON;
          return icon;
        }

        function searchableText(item) {
          return [
            item.id,
            item.description,
            item.language,
            ...(Array.isArray(item.tags) ? item.tags : [])
          ].map(normalize).join(' ');
        }

        function searchKeywords() {
          return normalize(searchInput.value).split(/\s+/).filter(Boolean);
        }

        function matchKeywords(item, keywords) {
          const text = searchableText(item);
          return keywords.every((keyword) => text.includes(keyword));
        }

        // 语言筛选与关键词搜索是 AND 叠加；语言多选取并集，空集 = 不限语言。
        function filteredTemplates() {
          const keywords = searchKeywords();
          return state.templates.filter((item) =>
            (state.langFilter.size === 0 || state.langFilter.has(langKey(item)))
            && matchKeywords(item, keywords));
        }

        // 数量徽章：显示「当前关键词下该语言还有多少可选」，无搜索时即数据概览。
        function updateChipCounts() {
          const keywords = searchKeywords();
          const counts = new Map();
          for (const item of state.templates) {
            if (!matchKeywords(item, keywords)) continue;
            const key = langKey(item);
            counts.set(key, (counts.get(key) || 0) + 1);
          }
          for (const [key, chip] of state.langChips) {
            const amount = counts.get(key) || 0;
            chip.count.textContent = `(${amount})`;
            chip.checkbox.closest('.filter-chip').classList.toggle('zero', amount === 0);
          }
        }

        // 筛选条从数据动态推导语言清单（按数量降序），不硬编码；只在数据加载后构建一次。
        function buildFilterBar() {
          const totals = new Map();
          for (const item of state.templates) {
            const key = langKey(item);
            totals.set(key, (totals.get(key) || 0) + 1);
          }
          const keys = [...totals.keys()]
            .sort((a, b) => totals.get(b) - totals.get(a) || a.localeCompare(b));

          state.langChips.clear();
          filterOptions.replaceChildren();
          for (const key of keys) {
            const chip = document.createElement('label');
            chip.className = 'filter-chip';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = key;
            checkbox.checked = state.langFilter.has(key);
            checkbox.addEventListener('change', () => {
              if (checkbox.checked) state.langFilter.add(key);
              else state.langFilter.delete(key);
              syncLangToUrl();
              render();
            });
            chip.append(checkbox);
            chip.append(languageIcon(key === 'unknown' ? '' : key));
            appendText(chip, key === 'unknown' && !languageMeta(key) ? '未知' : languageLabel(key), 'chip-label');
            const count = appendText(chip, `(${totals.get(key)})`, 'count');
            filterOptions.append(chip);
            state.langChips.set(key, { checkbox, count });
          }
        }

        function syncLangToUrl() {
          const url = new URL(window.location.href);
          if (state.langFilter.size > 0) url.searchParams.set('lang', [...state.langFilter].join(','));
          else url.searchParams.delete('lang');
          // 逗号在 query 里是合法字符，保持 ?lang=py,hs 的可读形态。
          window.history.replaceState(null, '', url.toString().replace(/%2C/g, ','));
        }

        // 从 ?lang=cpp,py 恢复勾选；不在数据里的语言键直接忽略。
        function restoreLangFromUrl() {
          const raw = new URLSearchParams(window.location.search).get('lang');
          const wanted = (raw || '').split(',').map((part) => part.trim()).filter(Boolean);
          state.langFilter = new Set(state.langChips.size > 0
            ? wanted.filter((key) => state.langChips.has(key))
            : wanted);
          for (const [key, chip] of state.langChips) {
            chip.checkbox.checked = state.langFilter.has(key);
          }
        }

        window.addEventListener('popstate', () => {
          restoreLangFromUrl();
          render();
        });

        function appendText(parent, text, className) {
          const element = document.createElement('span');
          if (className) element.className = className;
          element.textContent = text;
          parent.append(element);
          return element;
        }

        function addButton(parent, label, action, id) {
          const button = document.createElement('button');
          button.className = 'action-button';
          button.type = 'button';
          button.dataset.action = action;
          button.dataset.id = id;
          button.textContent = label;
          parent.append(button);
        }

        function renderArticles(parent, articles) {
          const list = document.createElement('div');
          list.className = 'article-list';
          appendText(list, '关联文章', 'article-list-label');
          if (!Array.isArray(articles) || articles.length === 0) {
            appendText(list, '暂无', 'article-empty');
            parent.append(list);
            return;
          }

          for (const article of articles) {
            const url = typeof article.url === 'string' && article.url.startsWith('/') ? article.url : '#';
            const link = document.createElement('a');
            link.href = url;
            link.textContent = article.title || article.id || '未命名文章';
            if (url !== '#') {
              link.target = '_blank';
              link.rel = 'noopener';
            }
            list.append(link);
          }
          parent.append(list);
        }

        function render() {
          const items = filteredTemplates();
          updateChipCounts();
          result.replaceChildren();
          setStatus(`显示 ${items.length} / ${state.templates.length} 个模板`);

          if (items.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-state';
            empty.textContent = state.templates.length === 0 ? '没有可用的代码模板' : '没有匹配的代码模板';
            result.append(empty);
            return;
          }

          for (const [index, item] of items.entries()) {
            const card = document.createElement('li');
            card.className = 'template-card';

            const heading = document.createElement('div');
            heading.className = 'card-heading';
            heading.append(languageIcon(item.language));
            appendText(heading, item.description || item.id || '未命名模板', 'card-title');
            card.append(heading);
            appendText(card, item.id || '', 'card-id');

            const tags = Array.isArray(item.tags) ? item.tags : [];
            if (tags.length > 0) {
              const details = document.createElement('div');
              details.className = 'card-details';
              for (const tag of tags) appendText(details, tag, 'badge');
              card.append(details);
            }

            renderArticles(card, item.articles);

            const actions = document.createElement('div');
            actions.className = 'card-actions';
            addButton(actions, '查看', 'view', item.id);
            addButton(actions, '复制', 'copy', item.id);
            addButton(actions, '下载', 'download', item.id);
            if (item.sh) addButton(actions, '命令', 'shell', item.id);
            // 序号缩小变暗放右下角：靠 margin-left:auto 推到操作行最右端。
            appendText(actions, String(index + 1).padStart(3, '0'), 'card-number');
            card.append(actions);
            result.append(card);
          }
        }

        function fileNameFromPath(filePath, fallback) {
          const parts = String(filePath || '').split('/');
          return parts[parts.length - 1] || `${fallback || 'code'}.txt`;
        }

        function prismLanguage(language) {
          const value = normalize(language);
          const aliases = {
            'c++': 'cpp',
            'cc': 'cpp',
            'cxx': 'cpp',
            'c#': 'csharp',
            'cs': 'csharp',
            'js': 'javascript',
            'ts': 'typescript',
            'py': 'python',
            'rs': 'rust',
            'sh': 'bash',
            'shell': 'bash',
            'hs': 'haskell',
            'html': 'markup',
            'vue': 'markup',
            'md': 'markdown'
          };
          return aliases[value] || value || 'none';
        }

        async function loadCode(item) {
          if (state.detailCache.has(item.id)) return state.detailCache.get(item.id);
          const detail = await requestJson(`/api/codes?id=${encodeURIComponent(item.id)}&includeContent=true`);
          if (typeof detail.content !== 'string') throw new Error('API 响应缺少代码内容');
          state.detailCache.set(item.id, detail);
          return detail;
        }

        function showModal(detail) {
          state.selected = detail;
          state.selectedContent = detail.content;
          modalTitle.textContent = detail.description || detail.id || '代码模板';
          modalCode.className = `language-${prismLanguage(detail.language)}`;
          modalCode.textContent = detail.content;
          modalBackdrop.hidden = false;
          document.body.style.overflow = 'hidden';
          if (window.Prism && prismLanguage(detail.language) !== 'none') {
            window.Prism.highlightElement(modalCode);
          }
        }

        function closeModal() {
          modalBackdrop.hidden = true;
          document.body.style.overflow = '';
          state.selected = null;
          state.selectedContent = '';
          modalCode.textContent = '';
        }

        async function copyText(text, successMessage) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              const textarea = document.createElement('textarea');
              textarea.value = text;
              textarea.style.position = 'fixed';
              textarea.style.opacity = '0';
              document.body.append(textarea);
              textarea.select();
              if (!document.execCommand('copy')) throw new Error('浏览器拒绝复制');
              textarea.remove();
            }
            showToast(successMessage);
          } catch (error) {
            showToast(`复制失败: ${error instanceof Error ? error.message : String(error)}`);
          }
        }

        function downloadText(text, filename) {
          const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          document.body.append(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          showToast(`开始下载 ${filename}`);
        }

        async function handleAction(action, id) {
          const item = state.templates.find((template) => template.id === id);
          if (!item) return;
          try {
            const detail = await loadCode(item);
            const filename = fileNameFromPath(detail.path, detail.id);
            if (action === 'view') showModal(detail);
            if (action === 'copy') await copyText(detail.content, '代码已复制');
            if (action === 'download') downloadText(detail.content, filename);
            if (action === 'shell' && detail.sh) await copyText(detail.sh, '命令已复制');
          } catch (error) {
            showToast(`获取代码失败: ${error instanceof Error ? error.message : String(error)}`);
          }
        }

        searchInput.addEventListener('input', render);
        result.addEventListener('click', (event) => {
          const button = event.target.closest('button[data-action]');
          if (button) handleAction(button.dataset.action, button.dataset.id);
        });
        document.querySelector('#modal-close').addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (event) => {
          if (event.target === modalBackdrop) closeModal();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !modalBackdrop.hidden) closeModal();
        });
        document.querySelector('[data-modal-action="copy"]').addEventListener('click', () => {
          if (state.selected) copyText(state.selectedContent, '代码已复制');
        });
        document.querySelector('[data-modal-action="download"]').addEventListener('click', () => {
          if (!state.selected) return;
          downloadText(state.selectedContent, fileNameFromPath(state.selected.path, state.selected.id));
        });

        loadTemplates().catch((error) => {
          setStatus(`加载失败: ${error instanceof Error ? error.message : String(error)}`, true);
          result.replaceChildren();
        });
      })();
    </script>
  </body>
</html>
