<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>rbook: 标签浏览</title>
    <style>
      :root{color-scheme:dark;--bg:#101418;--panel:#171d23;--raised:#1e262e;--border:#34414d;--text:#e7edf2;--muted:#98a6b3;--accent:#ffc857;--accent-strong:#ffe08a;--link:#79c7ff;--danger:#ff8e8e}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-width:320px}.shell{margin:auto;max-width:1280px;padding:2rem 1.25rem 4rem}.topbar{align-items:center;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;padding-bottom:.8rem}.topbar a{color:var(--muted);padding:.35rem .55rem;text-decoration:none}.topbar a:hover,.topbar a[aria-current="page"]{color:var(--accent-strong)}h1{color:var(--accent-strong);font-size:2.2rem;margin:0}.lead{color:var(--muted);margin:.35rem 0 1.2rem}.controls{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1rem}.controls input,.controls select{background:var(--raised);border:1px solid var(--border);color:var(--text);min-height:2.5rem;padding:.45rem .6rem}.controls input{flex:1 1 16rem}.controls input:focus,.controls select:focus,.tag-button:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}.status{color:var(--muted);min-height:2rem;padding:.5rem 0}.status.error{color:var(--danger)}.layout{display:grid;gap:1rem;grid-template-columns:minmax(18rem,.75fr) minmax(0,1.5fr)}.panel{background:var(--panel);border:1px solid var(--border);padding:1rem}.tag-table{border-collapse:collapse;width:100%}.tag-table th,.tag-table td{border-bottom:1px solid var(--border);padding:.55rem .4rem;text-align:left}.tag-table th{color:var(--muted);font-size:.8rem;font-weight:500}.tag-button{background:transparent;border:0;color:var(--link);cursor:pointer;padding:0;text-align:left}.tag-button:hover{text-decoration:underline}.bar{background:var(--raised);height:.45rem;min-width:5rem}.bar span{background:var(--accent);display:block;height:100%}.selected-title{color:var(--accent-strong);font-size:1.1rem;margin:0 0 .8rem}.items{display:grid;gap:.6rem;list-style:none;margin:0;padding:0}.item{border-bottom:1px solid var(--border);padding-bottom:.6rem}.item a{color:var(--link);font-weight:700;overflow-wrap:anywhere;text-decoration:none}.item a:hover{text-decoration:underline}.item small{color:var(--muted);display:block;overflow-wrap:anywhere}.badge{border:1px solid var(--border);color:var(--accent-strong);font-size:.76rem;margin-right:.35rem;padding:.12rem .35rem}.empty{color:var(--muted);padding:1.5rem;text-align:center}@media(max-width:760px){.layout{grid-template-columns:1fr}}@media(max-width:500px){.shell{padding:1.25rem .85rem 3rem}.controls input,.controls select{width:100%}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="rbook 工具导航"><a href="/">首页</a><a href="/explore">文章探索</a><a href="/code_template">代码模板</a><a href="/tags" aria-current="page">标签</a><a href="/relations">关系</a><a href="/practice">学习队列</a></nav>
      <h1>标签浏览</h1>
      <p class="lead">按数量浏览文章和代码模板标签。多个标签筛选遵循 API 的 OR 语义。</p>
      <div class="controls"><input id="search" type="search" placeholder="搜索标签名称" autocomplete="off"><select id="type"><option value="all">全部类型</option><option value="article">文章</option><option value="code">代码模板</option></select><select id="order"><option value="count">按数量</option><option value="name">按名称</option></select></div>
      <div id="status" class="status" role="status" aria-live="polite">正在加载标签...</div>
      <div class="layout"><section class="panel"><table class="tag-table"><thead><tr><th>类型</th><th>标签</th><th>数量</th><th>占比</th></tr></thead><tbody id="tag-list"></tbody></table></section><section class="panel" id="detail"><p class="empty">选择标签查看关联文章和模板。</p></section></div>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search); const state = { articleTags: [], codeTags: [], pages: [], codes: [], selected: params.get('tag') || '', type: params.get('type') || 'all', order: 'count', search: params.get('q') || '' };
        const search = document.querySelector('#search'); const type = document.querySelector('#type'); const order = document.querySelector('#order'); const status = document.querySelector('#status'); const tagList = document.querySelector('#tag-list'); const detail = document.querySelector('#detail');
        search.value = state.search; type.value = state.type;
        function text(parent, tag, value) { const element = document.createElement(tag); element.textContent = value == null ? '' : String(value); parent.append(element); return element; }
        function setUrl() { const next = new URLSearchParams(); if (state.selected) next.set('tag', state.selected); if (state.type !== 'all') next.set('type', state.type); if (state.search) next.set('q', state.search); history.replaceState(null, '', `${location.pathname}${next.toString() ? `?${next}` : ''}`); }
        function combinedTags() { return [...state.articleTags.map((item) => ({ ...item, type: 'article' })), ...state.codeTags.map((item) => ({ ...item, type: 'code' }))]; }
        function visibleTags() { const needle = state.search.toLocaleLowerCase(); let items = combinedTags().filter((item) => (state.type === 'all' || item.type === state.type) && (!needle || item.tag.toLocaleLowerCase().includes(needle))); return items.sort((a, b) => state.order === 'name' ? a.tag.localeCompare(b.tag, 'zh-CN') || a.type.localeCompare(b.type) : b.count - a.count || a.tag.localeCompare(b.tag, 'zh-CN')); }
        function renderList() { setUrl(); const items = visibleTags(); tagList.replaceChildren(); const max = Math.max(...items.map((item) => item.count), 1); items.forEach((item) => { const row = document.createElement('tr'); text(row, 'td', item.type === 'article' ? '文章' : '代码'); const name = document.createElement('td'); const button = text(name, 'button', item.tag); button.className = 'tag-button'; button.type = 'button'; button.addEventListener('click', () => { state.selected = item.tag; state.type = item.type; type.value = state.type; renderList(); renderDetail(); }); row.append(name); text(row, 'td', item.count); const barCell = document.createElement('td'); const bar = text(barCell, 'div', ''); bar.className = 'bar'; const fill = text(bar, 'span', ''); fill.style.width = `${Math.max(4, Math.round(item.count / max * 100))}%`; row.append(barCell); tagList.append(row); }); if (!items.length) { const row = document.createElement('tr'); const cell = text(row, 'td', '没有匹配的标签'); cell.colSpan = 4; cell.className = 'empty'; tagList.append(row); } status.textContent = `显示 ${items.length} 个标签；文章和代码标签分别统计。`; }
        function renderDetail() { detail.replaceChildren(); if (!state.selected) { detail.append(text(detail, 'p', '选择标签查看关联文章和模板。')); detail.lastChild.className = 'empty'; return; } const title = text(detail, 'h2', `${state.type === 'code' ? '代码模板' : '文章'}：${state.selected}`); title.className = 'selected-title'; const list = text(detail, 'ul', ''); list.className = 'items'; const items = state.type === 'code' ? state.codes.filter((item) => (item.tags || []).includes(state.selected)) : state.pages.filter((item) => (item.tags || []).includes(state.selected)); items.forEach((item) => { const li = document.createElement('li'); li.className = 'item'; const href = state.type === 'code' ? `/api/codes?id=${encodeURIComponent(item.id || '')}` : (item.url || '#'); const a = text(li, 'a', state.type === 'code' ? (item.description || item.id) : (item.title || item.id)); a.href = href; if (state.type === 'code') a.target = '_blank'; const small = text(li, 'small', `${item.id || ''}${item.description && state.type === 'article' ? ` · ${item.description}` : ''}`); list.append(li); }); detail.append(list); if (!items.length) { list.replaceChildren(); list.append(text(list, 'li', '没有关联条目。')); list.lastChild.className = 'empty'; } }
        async function load() { try { const responses = await Promise.all(['/api/tags', '/api/catalog', '/api/codes'].map((url) => fetch(url, { headers: { Accept: 'application/json' } }))); const payloads = await Promise.all(responses.map((response) => response.json())); const bad = responses.findIndex((response) => !response.ok); if (bad >= 0) throw new Error(payloads[bad].message || `HTTP ${responses[bad].status}`); state.articleTags = payloads[0].articleTags || []; state.codeTags = payloads[0].codeTags || []; state.pages = payloads[1].items || []; state.codes = payloads[2].items || []; renderList(); renderDetail(); } catch (error) { status.textContent = `加载失败：${error instanceof Error ? error.message : String(error)}`; status.className = 'status error'; } }
        search.addEventListener('input', () => { state.search = search.value.trim(); renderList(); }); type.addEventListener('change', () => { state.type = type.value; renderList(); renderDetail(); }); order.addEventListener('change', () => { state.order = order.value; renderList(); }); load();
      })();
    </script>
  </body>
</html>
